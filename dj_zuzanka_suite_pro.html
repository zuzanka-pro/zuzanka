<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DJ Zuzanka Suite Pro</title>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a;--bg1:#0d0d10;--bg2:#121216;
  --border:#22222c;--border-hi:#38384a;
  --text:#e0e0ec;--text-2:#8888a0;--text-3:#383848;
  --blue-hi:#5a9abf;--violet:#6a4a8a;
  --red:#a83030;--red-hi:#cc4444;--rec:#b03030;
  --mono:'IBM Plex Mono',monospace;
  --serif:'Cormorant Garamond',serif;
  --play:'Playfair Display',serif;
  --r:2px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;overflow-x:hidden;cursor:crosshair;display:flex;flex-direction:column;align-items:center;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.008) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.008) 1px,transparent 1px);background-size:48px 48px;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.82) 100%);}

.hdr{position:relative;z-index:20;width:100%;max-width:1000px;padding:2.2rem 2rem 1.8rem;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--border);}
.hdr-h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3.4rem);font-weight:700;color:var(--text);line-height:1;letter-spacing:.04em;}
.hdr-pro{transition:color .4s ease,text-shadow .4s ease;}
.hdr-pro.lit{color:var(--red-hi);text-shadow:0 0 14px rgba(204,68,68,.7),0 0 40px rgba(204,68,68,.25);}

.tabs{position:relative;z-index:20;width:100%;max-width:1000px;display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;background:transparent;border:none;color:var(--text-3);font-family:var(--serif);font-size:1.1rem;font-weight:600;padding:.75rem 1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);position:relative;letter-spacing:.14em;}
.tab:last-child{border-right:none;}
.tab::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:transparent;transition:background .18s;}
.tab:hover{color:var(--text-2);}
.tab.aw{color:var(--red-hi);}.tab.aw::after{background:var(--red-hi);}
.tab.at{color:var(--red-hi);}.tab.at::after{background:var(--red-hi);}

#pw,#pt{display:none;width:100%;max-width:1000px;position:relative;z-index:10;}
#pw.on,#pt.on{display:block;}

.slabel{display:flex;align-items:center;gap:.8rem;font-size:.46rem;letter-spacing:.3em;color:var(--text-3);text-transform:uppercase;margin-bottom:.65rem;}
.slabel::before,.slabel::after{content:'';flex:1;height:1px;background:var(--border);}
.spill{padding:.1rem .55rem;border:1px solid var(--border);font-size:.44rem;letter-spacing:.18em;color:var(--text-3);border-radius:var(--r);}

.wwrap{padding:2.2rem 2rem 8rem;display:flex;flex-direction:column;align-items:center;}
.key-group{width:100%;margin-bottom:1.4rem;}
.keys-row{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;}
.key{position:relative;width:88px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg1);cursor:pointer;transition:background .08s,border-color .1s,transform .06s;overflow:hidden;user-select:none;-webkit-user-select:none;border-radius:var(--r);}
.key:hover{border-color:var(--border-hi);background:var(--bg2);}
.key::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,var(--row-color) 0%,transparent 72%);opacity:0;transition:opacity .12s;}
.key::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--row-color);opacity:.2;transition:opacity .12s;}
.key.active{transform:scale(.93);border-color:var(--row-color)!important;background:var(--bg2);}
.key.active::before{opacity:.16;}.key.active::after{opacity:1;}
.key-shortcut{position:absolute;top:6px;right:7px;font-size:.42rem;color:var(--text-3);}
.key-letter{font-family:var(--play);font-size:2rem;font-weight:700;color:var(--text-3);position:relative;z-index:1;transition:color .1s;line-height:1;}
.key:hover .key-letter,.key.active .key-letter{color:var(--text-2);}
.key-name{font-size:.42rem;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase;margin-top:.45rem;text-align:center;padding:0 4px;position:relative;z-index:1;transition:color .1s;line-height:1.3;}
.key.active .key-name{color:var(--text-2);}
.row-base{--row-color:var(--blue-hi);}.row-shift{--row-color:var(--violet);}.row-alt{--row-color:var(--red-hi);}
@keyframes flash-out{0%{opacity:.45;transform:scale(1);}100%{opacity:0;transform:scale(3.5);}}
.key-flash{position:absolute;inset:0;border:1px solid var(--row-color);pointer-events:none;animation:flash-out .35s ease-out forwards;}
.witch-status{width:100%;display:flex;align-items:center;justify-content:space-between;padding:.55rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:.8rem 0 1.6rem;font-size:.48rem;letter-spacing:.18em;color:var(--text-3);text-transform:uppercase;}
#note-display{font-style:italic;color:var(--text-2);transition:color .3s;letter-spacing:.1em;font-family:var(--serif);font-size:.82rem;}
.loop-lights{display:flex;gap:4px;align-items:center;}
.loop-light{width:5px;height:5px;border:1px solid var(--border);transition:all .08s;border-radius:1px;}
.loop-light.on{background:var(--blue-hi);border-color:var(--blue-hi);box-shadow:0 0 5px var(--blue-hi);}
.controls{display:flex;align-items:center;gap:1.6rem;flex-wrap:wrap;justify-content:center;}
.ctrl-group{display:flex;align-items:center;gap:.65rem;font-size:.48rem;color:var(--text-3);letter-spacing:.22em;text-transform:uppercase;}
input[type=range]{-webkit-appearance:none;width:90px;height:1px;background:var(--border);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:var(--text-3);cursor:pointer;transition:background .15s;}
input[type=range]:hover::-webkit-slider-thumb{background:var(--text-2);}
.btn{background:transparent;border:1px solid var(--border);color:var(--text-3);font-family:var(--mono);font-size:.48rem;letter-spacing:.22em;padding:.38rem .88rem;cursor:pointer;transition:all .15s;text-transform:uppercase;border-radius:var(--r);}
.btn:hover{border-color:var(--border-hi);color:var(--text-2);}
.btn.on{border-color:var(--blue-hi);color:var(--blue-hi);}
.particle{position:fixed;pointer-events:none;z-index:500;font-size:.6rem;font-family:var(--mono);animation:pfloat 1s ease-out forwards;}
@keyframes pfloat{0%{opacity:.8;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-70px) scale(.4);}}
.witch-footer{margin-top:2.2rem;font-size:.44rem;letter-spacing:.45em;color:var(--text-3);text-transform:uppercase;}

#pt #page-techno{position:relative!important;inset:auto!important;width:100%!important;height:auto!important;min-height:100vh!important;display:flex!important;flex-direction:column;background:#0d0d0d;}
#pt .tz-back-arrow{display:none!important;}
#pt .tz-recorder{display:none!important;}

.rec-bar{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--bg1);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:.9rem;z-index:400;font-family:var(--mono);padding:0 1.6rem;}
.rec-label{color:var(--text-3);letter-spacing:.35em;font-size:.44rem;text-transform:uppercase;flex-shrink:0;}
.rec-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;}
.rec-btn{background:transparent;border:1px solid var(--border);color:var(--text-3);font-family:var(--mono);font-size:.46rem;letter-spacing:.2em;text-transform:uppercase;padding:.3rem .82rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:.4rem;flex-shrink:0;border-radius:var(--r);}
.rec-btn:hover:not(:disabled){border-color:var(--border-hi);color:var(--text-2);}
.rec-btn:disabled{opacity:.22;cursor:not-allowed;}
.rec-btn.armed{border-color:var(--rec);color:var(--rec);}
.rec-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.rec-btn.armed .rec-dot{animation:rdot .65s ease-in-out infinite;}
@keyframes rdot{0%,100%{opacity:1}50%{opacity:.08}}
.rec-timer{font-size:.56rem;color:var(--text-3);letter-spacing:.18em;min-width:42px;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0;}
.rec-timer.live{color:var(--rec);}
.rec-fmt-group{display:flex;gap:3px;flex-shrink:0;}
.rec-fmt{background:transparent;border:1px solid var(--border);color:var(--text-3);font-family:var(--mono);font-size:.42rem;letter-spacing:.18em;text-transform:uppercase;padding:.22rem .6rem;cursor:pointer;transition:all .15s;border-radius:var(--r);}
.rec-fmt:hover{border-color:var(--border-hi);color:var(--text-2);}
.rec-fmt.active{border-color:var(--red-hi);color:var(--red-hi);}
.rec-encoding{font-size:.44rem;letter-spacing:.2em;color:var(--red-hi);text-transform:uppercase;flex-shrink:0;display:none;}
.rec-encoding.visible{display:block;animation:blink .8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.rec-tracks{display:flex;align-items:center;gap:.4rem;overflow-x:auto;max-width:360px;flex-shrink:1;scrollbar-width:none;}
.rec-tracks::-webkit-scrollbar{display:none;}
.rec-track{display:flex;align-items:center;gap:.32rem;border:1px solid var(--border);padding:.22rem .48rem;white-space:nowrap;flex-shrink:0;font-size:.42rem;color:var(--text-3);border-radius:var(--r);}
.rec-track a{color:var(--red-hi);text-decoration:none;}
.rec-track a:hover{color:var(--text-2);}
</style>
</head>
<body class="mode-w">

<header class="hdr">
  <h1 class="hdr-h1">DJ Zuzanka Suite <span class="hdr-pro" id="hdr-pro">PRO</span></h1>
</header>

<nav class="tabs">
  <button class="tab aw" id="tw" onclick="switchTab('w')">I</button>
  <button class="tab"    id="tt" onclick="switchTab('t')">II</button>
</nav>

<div id="pw" class="on">
  <div class="wwrap">
    <canvas id="waveform" style="display:none;width:0;height:0;"></canvas>
    <div class="key-group"><div class="slabel"><span class="spill">Default</span></div><div class="keys-row" id="row-base"></div></div>
    <div class="key-group"><div class="slabel"><span class="spill">Shift +</span></div><div class="keys-row" id="row-shift"></div></div>
    <div class="key-group"><div class="slabel"><span class="spill">Alt +</span></div><div class="keys-row" id="row-alt"></div></div>
    <div class="witch-status">
      <span id="note-display">&#8212; awaiting input &#8212;</span>
      <div class="loop-lights" id="loop-lights">
        <div class="loop-light"></div><div class="loop-light"></div>
        <div class="loop-light"></div><div class="loop-light"></div>
        <div class="loop-light"></div><div class="loop-light"></div>
        <div class="loop-light"></div><div class="loop-light"></div>
      </div>
    </div>
    <div class="controls">
      <div class="ctrl-group"><span>BPM</span><input type="range" id="bpm" min="40" max="160" value="128"><span id="bpm-val">128</span></div>
      <button class="btn" id="reverb-btn">Reverb</button>
      <button class="btn" id="loop-btn">Loop</button>
      <button class="btn" id="clear-btn">Clear</button>
    </div>
    <footer class="witch-footer">Z &nbsp;·&nbsp; U &nbsp;·&nbsp; Z &nbsp;·&nbsp; A &nbsp;·&nbsp; N &nbsp;·&nbsp; K &nbsp;·&nbsp; A</footer>
  </div>
</div>

<div id="pt">
  <div id="page-techno">

id="page-techno" class="page">
<style>
  /* Standalone: always show this page */
  #page-techno { display: block !important; }

  /* Make techno page truly fullscreen — fixed, covers everything */
  #page-techno {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    min-height: unset !important;
    background: #0d0d0d;
    overflow: hidden;
    display: none;
    flex-direction: column;
    z-index: 500;
  }
  #page-techno.active {
    display: flex !important;
    animation: fadeIn 0.5s ease;
  }

  .tz-bg-layer { position: absolute; inset: 0; pointer-events: none; }
  .tz-bg-layer.grad   { z-index: 0; background: #0d0d0d; }
  .tz-bg-layer.scanlines {
    z-index: 1;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px,
      rgba(255,255,255,0.018) 3px, rgba(255,255,255,0.018) 4px);
  }
  .tz-bg-layer.vignette {
    z-index: 2;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 30%, rgba(0,0,0,0.65) 100%);
  }

  #tz-flash { position: absolute; inset: 0; pointer-events: none; z-index: 60; background: rgba(255,255,255,0); }
  #tz-flash.tz-pop { animation: tzFlashAnim 0.12s ease-out forwards; }
  @keyframes tzFlashAnim { 0% { background: rgba(255,255,255,0.14); } 100% { background: rgba(255,255,255,0); } }

  .tz-ripple {
    position: fixed; border-radius: 50%; border: 1px solid rgba(255,255,255,0.32);
    pointer-events: none; z-index: 50; transform: translate(-50%,-50%);
    animation: tzRippleAnim 0.8s cubic-bezier(0.15,0.5,0.5,1) forwards;
  }
  @keyframes tzRippleAnim { from{width:8px;height:8px;opacity:0.7} to{width:220px;height:220px;opacity:0} }

  /* BACK ARROW — small, floating top-left */
  .tz-back-arrow {
    position: absolute; top: 1.4rem; left: 1.6rem; z-index: 100;
    background: none; border: none; cursor: pointer; padding: 0.3rem;
    color: rgba(255,255,255,0.2);
    font-family: 'Cormorant Garamond', serif; font-size: 1.1rem;
    line-height: 1; letter-spacing: 0;
    transition: color 0.3s ease, transform 0.25s ease;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .tz-back-arrow:hover { color: rgba(255,255,255,0.7); transform: translateX(-3px); }
  .tz-back-arrow-label {
    font-size: 0.5rem; letter-spacing: 0.2em; text-transform: uppercase;
    font-weight: 300; opacity: 0; transition: opacity 0.25s;
    white-space: nowrap;
  }
  .tz-back-arrow:hover .tz-back-arrow-label { opacity: 1; }

  /* TEMPO BAR */
  .tz-tempo-bar {
    position: relative; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    gap: 0.9rem; padding: 0.75rem 4rem 0.65rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap; flex-shrink: 0;
  }
  .tz-bpm-btn {
    font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; font-weight: 400;
    letter-spacing: 0.1em; background: none;
    border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.35);
    cursor: pointer; padding: 0.22rem 0.8rem; transition: all 0.2s ease; line-height: 1;
  }
  .tz-bpm-btn:hover { border-color: rgba(255,255,255,0.48); color: rgba(255,255,255,0.82); }
  .tz-bpm-btn.active { border-color: #cc1111; color: #cc1111; background: rgba(180,0,0,0.05); }
  .tz-bpm-display {
    font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 600;
    color: rgba(255,255,255,0.45); min-width: 58px; text-align: center; transition: color 0.15s;
  }
  .tz-bpm-display.beat { color: #cc1111; }
  .tz-bpm-label {
    font-family: 'Cormorant Garamond', serif; font-size: 0.5rem; font-weight: 300;
    letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.18);
  }
  .tz-tempo-slider {
    -webkit-appearance: none; appearance: none;
    width: 100px; height: 1px; background: rgba(255,255,255,0.14); outline: none; cursor: pointer;
  }
  .tz-tempo-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 8px; height: 8px;
    border-radius: 50%; background: rgba(255,255,255,0.45); cursor: pointer;
  }
  .tz-tempo-slider:hover::-webkit-slider-thumb { background: #cc1111; }

  /* MAIN SCROLLABLE AREA */
  .tz-stage {
    position: relative; z-index: 10;
    flex: 1; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 1.8rem 1.5rem 1.5rem;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .tz-stage::-webkit-scrollbar { width: 3px; }
  .tz-stage::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* LETTER ROWS */
  .tz-row {
    display: flex; gap: clamp(0.4rem,2vw,1.3rem);
    align-items: baseline; justify-content: center;
    flex-wrap: nowrap; margin-bottom: 0.35rem; flex-shrink: 0;
  }
  .tz-rows-sep {
    width: 85%; max-width: 680px;
    height: 1px; background: rgba(255,255,255,0.06);
    margin: 1rem 0; flex-shrink: 0;
  }

  /* BASE LETTER — all Cormorant Garamond */
  .tz-letter {
    font-family: 'Cormorant Garamond', serif;
    color: rgba(255,255,255,0.12);
    cursor: pointer; position: relative;
    user-select: none; line-height: 1;
    padding: 0.04em 0.1em;
    transition: color 0.2s ease, transform 0.15s ease;
  }
  .tz-letter-name {
    display: block; position: absolute;
    bottom: -1.65em; left: 50%; transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif; font-size: 0.4rem; font-weight: 300;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.13); white-space: nowrap;
    pointer-events: none; transition: color 0.3s;
  }

  /* Row variants — same font, weight/style/size differ */
  .tz-row-a .tz-letter { font-size: clamp(4rem,10.5vw,8rem); font-weight: 700; }
  .tz-row-b .tz-letter { font-size: clamp(2.8rem,7vw,5.5rem); font-weight: 400; font-style: italic; }
  .tz-row-c .tz-letter { font-size: clamp(2rem,5vw,4rem); font-weight: 300; color: rgba(255,255,255,0.1); }
  .tz-row-d .tz-letter { font-size: clamp(1.5rem,3.8vw,3rem); font-weight: 600; font-style: italic; color: rgba(255,255,255,0.1); }
  .tz-row-e .tz-letter { font-size: clamp(1.1rem,2.7vw,2.2rem); font-weight: 300; font-style: italic; color: rgba(255,255,255,0.09); letter-spacing: 0.12em; }

  .tz-letter:hover { color: rgba(255,255,255,0.52); transform: scale(1.05) translateY(-3px); }
  .tz-letter:hover .tz-letter-name { color: rgba(255,255,255,0.38); }

  .tz-letter.tz-on { color: #cc1111 !important; animation: tzLetterPulse 0.42s ease-in-out infinite alternate; }
  .tz-letter.tz-on .tz-letter-name { color: rgba(200,30,30,0.7) !important; }
  @keyframes tzLetterPulse {
    from { text-shadow: 0 0 8px #cc1111, 0 0 22px rgba(180,0,0,0.6), 0 0 44px rgba(160,0,0,0.3); transform: scale(1.02) translateY(-1px); }
    to   { text-shadow: 0 0 14px #ee2222, 0 0 44px rgba(200,0,0,0.78), 0 0 85px rgba(160,0,0,0.42); transform: scale(1.09) translateY(-5px); }
  }
  .tz-letter.tz-burst { animation: tzLetterBurst 0.52s cubic-bezier(0.22,0.9,0.36,1) forwards !important; }
  @keyframes tzLetterBurst {
    0%  { color:#fff; text-shadow:0 0 30px #fff,0 0 65px #cc1111,0 0 130px #880000; transform:scale(1.3) translateY(-10px); }
    45% { color:#ee3333; text-shadow:0 0 16px #cc1111,0 0 45px rgba(180,0,0,0.75); transform:scale(1.12) translateY(-5px); }
    100%{ color:#cc1111; text-shadow:0 0 9px #cc1111,0 0 25px rgba(160,0,0,0.6); transform:scale(1.05) translateY(-2px); }
  }
  .tz-letter.tz-fade { animation: tzLetterFade 0.65s ease forwards !important; }
  @keyframes tzLetterFade {
    from { color:#cc1111; text-shadow:0 0 9px #cc1111,0 0 25px rgba(160,0,0,0.55); }
    to   { color:rgba(255,255,255,0.12); text-shadow:none; }
  }

  /* VISUALIZER */
  .tz-visualizer { display:flex; gap:3px; align-items:flex-end; height:34px; margin:1.5rem 0 1.2rem; flex-shrink:0; }
  .tz-bar { width:4px; background:rgba(255,255,255,0.1); border-radius:1px 1px 0 0; height:3px; transition:height 0.06s ease,background 0.12s ease; }

  /* TRACK INFO */
  .tz-track-info {
    font-family:'Cormorant Garamond',serif; font-size:0.68rem; font-weight:300;
    letter-spacing:0.22em; text-transform:uppercase;
    color:rgba(255,255,255,0.18); text-align:center;
    min-height:1.2em; transition:color 0.4s,text-shadow 0.4s;
    margin-bottom:1.2rem; flex-shrink:0;
  }
  .tz-track-info.tz-live { color:rgba(210,45,45,0.82); text-shadow:0 0 12px rgba(180,0,0,0.35); }

  /* STOP */
  .tz-stop {

<script>

// ═══════════════════════════════════════════════════════════
// AUDIO CONTEXT + MASTER SIGNAL CHAIN
// ═══════════════════════════════════════════════════════════
const AC = new (window.AudioContext || window.webkitAudioContext)();

// ① Analyser — waveform display input, everything routes here
const analyser = AC.createAnalyser();
analyser.fftSize = 2048;

// ② Master EQ — low-shelf warmth + high-shelf air
const eqLo = AC.createBiquadFilter();
eqLo.type = 'lowshelf'; eqLo.frequency.value = 90; eqLo.gain.value = 2.5;
const eqHi = AC.createBiquadFilter();
eqHi.type = 'highshelf'; eqHi.frequency.value = 9000; eqHi.gain.value = 1.5;

// ③ Bus compressor — program glue
const busComp = AC.createDynamicsCompressor();
busComp.threshold.value = -16; busComp.knee.value = 6;
busComp.ratio.value = 3;  busComp.attack.value = 0.003; busComp.release.value = 0.2;

// ④ Limiter — true peak protection
const limiter = AC.createDynamicsCompressor();
limiter.threshold.value = -1; limiter.knee.value = 0;
limiter.ratio.value = 20;    limiter.attack.value = 0.001; limiter.release.value = 0.04;

// ⑤ Master gain
const masterOut = AC.createGain(); masterOut.gain.value = 0.80;

// Wire it: analyser → eqLo → eqHi → busComp → limiter → masterOut → destination
analyser.connect(eqLo);
eqLo.connect(eqHi);
eqHi.connect(busComp);
busComp.connect(limiter);
limiter.connect(masterOut);
masterOut.connect(AC.destination);

// ─── Reverb IR (synthesised convolution) ───────────────────
let reverbEnabled = false, reverbConv = null;
(async () => {
  reverbConv = AC.createConvolver();
  const sr = AC.sampleRate, len = Math.floor(sr * 3.8);
  const buf = AC.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const er = i < sr * 0.02 ? Math.sin(Math.PI * i / (sr * 0.02)) * 0.5 : 0;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t / 3.8, 2.6) + er * (Math.random() * 2 - 1);
    }
  }
  reverbConv.buffer = buf;
})();

// ─── Routing helpers ────────────────────────────────────────
function send(node, wet = 0.35) {
  if (reverbEnabled && reverbConv) {
    const dryG = AC.createGain(), wetG = AC.createGain();
    dryG.gain.value = 1 - wet * 0.5; wetG.gain.value = wet;
    node.connect(dryG); dryG.connect(analyser);
    node.connect(reverbConv); reverbConv.connect(wetG); wetG.connect(analyser);
  } else {
    node.connect(analyser);
  }
}

// Soft-clip waveshaper (warm analogue saturation)
function mkSat(drive = 2.5) {
  const ws = AC.createWaveShaper();
  const n = 512, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2 / n) - 1;
    c[i] = (Math.PI + drive) * x / (Math.PI + drive * Math.abs(x));
  }
  ws.curve = c; ws.oversample = '4x';
  return ws;
}

function resume() { if (AC.state === 'suspended') AC.resume(); }

// ═══════════════════════════════════════════════════════════
// SOUND LIBRARY — 21 instruments
// ═══════════════════════════════════════════════════════════

// ── BASE ROW ────────────────────────────────────────────────
function snd_hexBass() {
  const t = AC.currentTime;
  // triple-layer: sub sine + detuned saw pair
  [[27.5,'sine',0.75,120],[55,'sawtooth',0.26,700],[55.4,'sawtooth',0.24,700]].forEach(([f,type,vol,fco],i) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(i>0) o.frequency.exponentialRampToValueAtTime(f*0.7, t+0.38);
    flt.type='lowpass'; flt.Q.value=i===0?1:5;
    flt.frequency.setValueAtTime(fco,t); flt.frequency.exponentialRampToValueAtTime(fco*0.2,t+0.5);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.9);
    o.connect(flt); flt.connect(g); send(g,0.3); o.start(t); o.stop(t+1.9);
  });
}

function snd_ghostbell() {
  const t = AC.currentTime;
  [[261,0,0.18],[329,0.07,0.15],[392,0.13,0.12],[523,0.19,0.09],[784,0.25,0.06],[1047,0.31,0.04]].forEach(([f,dt,vol]) => {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(vol,t+dt+0.012);
    g.gain.exponentialRampToValueAtTime(0.001,t+dt+3.5);
    o.connect(g); send(g,0.65); o.start(t+dt); o.stop(t+dt+3.5);
  });
}

function snd_covenDrum() {
  const t = AC.currentTime;
  // sub + body + crack
  [[0,'sine',65,25,0,0.6,1.1],[1,'sine',150,50,0,0.5,0.18]].forEach(([,type,f0,f1,dt,vol,dur]) => {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t+dt); o.frequency.exponentialRampToValueAtTime(f1,t+dt+0.2);
    g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(vol,t+dt+0.003);
    g.gain.exponentialRampToValueAtTime(0.001,t+dt+dur);
    o.connect(g); send(g,0.1); o.start(t+dt); o.stop(t+dt+dur+0.01);
  });
  const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.08),AC.sampleRate);
  const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(), ng=AC.createGain(), flt=AC.createBiquadFilter();
  flt.type='bandpass'; flt.frequency.value=3500; flt.Q.value=0.9;
  ng.gain.setValueAtTime(0.28,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  src.buffer=nb; src.connect(flt); flt.connect(ng); send(ng,0.1); src.start(t); src.stop(t+0.08);
}

function snd_witchPad() {
  const t = AC.currentTime;
  [130,130.7,155,155.5,185,220].forEach((f,i) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type=i<4?'sawtooth':'triangle'; o.frequency.value=f+(Math.random()-0.5)*1.2;
    flt.type='lowpass'; flt.frequency.value=1100; flt.Q.value=1.5;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.052,t+0.8);
    g.gain.linearRampToValueAtTime(0.038,t+2.5); g.gain.exponentialRampToValueAtTime(0.001,t+4.5);
    o.connect(flt); flt.connect(g); send(g,0.5); o.start(t); o.stop(t+4.5);
  });
  const sub=AC.createOscillator(), sg=AC.createGain();
  sub.type='sine'; sub.frequency.value=65;
  sg.gain.setValueAtTime(0,t); sg.gain.linearRampToValueAtTime(0.28,t+0.6); sg.gain.exponentialRampToValueAtTime(0.001,t+4.5);
  sub.connect(sg); send(sg,0.2); sub.start(t); sub.stop(t+4.5);
}

  const t = AC.currentTime;

function snd_sigilFX() {
  const t = AC.currentTime;
  const len=Math.floor(AC.sampleRate*1.1), buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(i/len);}

  g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+1.1);

function snd_nightSweep() {
  const t = AC.currentTime;
  [100,150,200,267].forEach(f => {
    const o=AC.createOscillator(),g=AC.createGain(),flt=AC.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=f+(Math.random()-0.5)*2;
    flt.type='lowpass'; flt.Q.value=3;
    flt.frequency.setValueAtTime(80,t); flt.frequency.exponentialRampToValueAtTime(4200,t+2.5);
    flt.frequency.exponentialRampToValueAtTime(65,t+5.2);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.075,t+0.55);
    g.gain.linearRampToValueAtTime(0.055,t+4); g.gain.exponentialRampToValueAtTime(0.001,t+5.2);
    o.connect(flt); flt.connect(g); send(g,0.45); o.start(t); o.stop(t+5.2);
  });
}

function snd_kettleDrum() {
  const t = AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(48,t+0.75);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.9,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
  o.connect(g); send(g,0.15); o.start(t); o.stop(t+1.2);
  const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.04),AC.sampleRate);
  const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(),ng=AC.createGain(),flt=AC.createBiquadFilter();
  flt.type='bandpass'; flt.frequency.value=3200; flt.Q.value=2;
  ng.gain.setValueAtTime(0.35,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  src.buffer=nb; src.connect(flt); flt.connect(ng); send(ng,0.1); src.start(t); src.stop(t+0.04);

function snd_echoPluck() {
  const t = AC.currentTime;
  [0,0.19,0.38,0.57,0.76].forEach((dt,i) => {
    const o=AC.createOscillator(),g=AC.createGain(),flt=AC.createBiquadFilter();
    o.type='triangle'; o.frequency.value=440;
    flt.type='lowpass'; flt.frequency.value=3200-i*450;
    const vol=0.28*Math.pow(0.62,i);
    g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(vol,t+dt+0.007);
    g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.3);
    o.connect(flt); flt.connect(g); send(g,0.38); o.start(t+dt); o.stop(t+dt+0.32);

}

// ── ALT ROW ─────────────────────────────────────────────────

    flt.type='lowpass'; flt.frequency.value=90; flt.Q.value=2;

    o.connect(flt); flt.connect(g); send(g,0.3); o.start(t); o.stop(t+6);
  });

function snd_crystalStab() {
  const t = AC.currentTime;
  [[1046,0,0.2],[1318,0.018,0.17],[1568,0.036,0.14],[2093,0.054,0.1],[2637,0.072,0.07]].forEach(([f,dt,vol]) => {
    const o=AC.createOscillator(),g=AC.createGain();

function snd_glitchPerc() {
  const t = AC.currentTime;
  for(let i=0;i<7;i++) {
    const len=Math.floor(AC.sampleRate*(0.015+Math.random()*0.035));
    const buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0); for(let j=0;j<d.length;j++) d[j]=Math.random()*2-1;
    const src=AC.createBufferSource(),g=AC.createGain(),flt=AC.createBiquadFilter(),hp=AC.createBiquadFilter();
    flt.type='peaking'; flt.frequency.value=400+Math.random()*4000; flt.gain.value=14;
    hp.type='highpass'; hp.frequency.value=200;
    const dt=i*0.06+Math.random()*0.02;
    g.gain.setValueAtTime(0.28-i*0.02,t+dt); g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.07);
    src.buffer=buf; src.connect(flt); flt.connect(hp); hp.connect(g); send(g,0.2); src.start(t+dt); src.stop(t+dt+0.1);
  }
}

function snd_bloodOrgan() {

  [[65,0.12],[98,0.1],[130,0.08],[196,0.06],[261,0.04]].forEach(([f,vol]) => {

    o.type='square'; o.frequency.value=f;
    flt.type='lowpass'; flt.frequency.value=f<100?200:900; flt.Q.value=1.5;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.65);
    g.gain.linearRampToValueAtTime(vol*0.7,t+3.2); g.gain.exponentialRampToValueAtTime(0.001,t+5.5);

function snd_metallicHat() {
  const t = AC.currentTime;
  const buf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.2),AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter(),pk=AC.createBiquadFilter();
  hp.type='highpass'; hp.frequency.value=6500;
  pk.type='peaking'; pk.frequency.value=9500; pk.gain.value=8; pk.Q.value=2;
  g.gain.setValueAtTime(0.68,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  src.buffer=buf; src.connect(hp); hp.connect(pk); pk.connect(g); send(g,0.15); src.start(t); src.stop(t+0.22);

function snd_witchChant() {
  const t = AC.currentTime;
  const car=AC.createOscillator(),mod=AC.createOscillator(),mG=AC.createGain(),g=AC.createGain(),flt=AC.createBiquadFilter();
  car.frequency.value=146; mod.frequency.value=146;
  mG.gain.setValueAtTime(360,t); mG.gain.exponentialRampToValueAtTime(75,t+0.9);
  flt.type='lowpass'; flt.frequency.value=2400;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.38,t+0.08);
  g.gain.linearRampToValueAtTime(0.26,t+2.2); g.gain.exponentialRampToValueAtTime(0.001,t+4);
  mod.connect(mG); mG.connect(car.frequency); car.connect(flt); flt.connect(g); send(g,0.5);
  mod.start(t); car.start(t); mod.stop(t+4); car.stop(t+4);
}

function snd_dimensionRip() {
  const t = AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain(),flt=AC.createBiquadFilter();
  o.type='sawtooth';
  o.frequency.setValueAtTime(20,t); o.frequency.exponentialRampToValueAtTime(10000,t+1.5);
  flt.type='bandpass'; flt.Q.value=8; flt.frequency.value=1200;
  g.gain.setValueAtTime(0.55,t); g.gain.exponentialRampToValueAtTime(0.001,t+1.5);
  o.connect(flt); flt.connect(g); send(g,0.45); o.start(t); o.stop(t+1.5);
  const sub=AC.createOscillator(),sg=AC.createGain();
  sub.type='sine'; sub.frequency.setValueAtTime(42,t); sub.frequency.exponentialRampToValueAtTime(18,t+1.5);
  sg.gain.setValueAtTime(0.5,t); sg.gain.exponentialRampToValueAtTime(0.001,t+1.5);
  sub.connect(sg); send(sg,0.1); sub.start(t); sub.stop(t+1.5);
}

// ═══════════════════════════════════════════════════════════
// INSTRUMENT DEFINITIONS
// ═══════════════════════════════════════════════════════════
const LETTERS = ['Z','U','Z','A','N','K','A'];
const ROWS = [
  { id:'row-base',  cls:'row-base',
    sounds:[snd_hexBass,snd_ghostbell,snd_covenDrum,snd_witchPad,snd_shadowHarp,snd_subDrone,snd_sigilFX],
    names:['Hex Bass','Ghostbell','Coven Drum','Witch Pad','Shadow Harp','Sub Drone','Sigil FX'],
    keys:['z','u','x','a','n','k','s'], hints:['Z','U','X','A','N','K','S'] },
  { id:'row-shift', cls:'row-shift',
    sounds:[snd_ritualBow,snd_ultraViolet,snd_hexClap,snd_arpDark,snd_nightSweep,snd_kettleDrum,snd_echoPluck],
    names:['Ritual Bow','Ultraviolet','Hex Clap','Dark Arp','Night Sweep','Kettle Drum','Echo Pluck'],
    keys:['z','u','x','a','n','k','s'], hints:['⇧Z','⇧U','⇧X','⇧A','⇧N','⇧K','⇧S'] },
  { id:'row-alt',   cls:'row-alt',
    sounds:[snd_voidRumble,snd_crystalStab,snd_glitchPerc,snd_bloodOrgan,snd_metallicHat,snd_witchChant,snd_dimensionRip],
    names:['Void Rumble','Crystal Stab','Glitch Perc','Blood Organ','Metal Hat','Witch Chant','Dim Rip'],
    keys:['z','u','x','a','n','k','s'], hints:['⌥Z','⌥U','⌥X','⌥A','⌥N','⌥K','⌥S'] },
];

// ═══════════════════════════════════════════════════════════
// BUILD KEY UI
// ═══════════════════════════════════════════════════════════
ROWS.forEach((row, ri) => {
  const cont = document.getElementById(row.id);
  row.keys.forEach((k, ci) => {
    const el = document.createElement('div');
    el.className = `key ${row.cls}`;
    el.innerHTML = `<span class="key-shortcut">${row.hints[ci]}</span>
      <span class="key-letter">${LETTERS[ci]}</span>
      <span class="key-name">${row.names[ci]}</span>`;
    el.addEventListener('pointerdown', e => { resume(); triggerInstr(ri, ci, e.clientX, e.clientY); });
    cont.appendChild(el);
  });
});

// ═══════════════════════════════════════════════════════════
// TRIGGER
// ═══════════════════════════════════════════════════════════
const noteDisplay = document.getElementById('note-display');
function triggerInstr(ri, ci, px, py) {
  ROWS[ri].sounds[ci]();
  const el = document.getElementById(ROWS[ri].id).children[ci];
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 175);
  const fl = document.createElement('div'); fl.className = 'key-flash'; el.appendChild(fl);
  setTimeout(() => fl.remove(), 420);
  if (px && py) {
    const p = document.createElement('div'); p.className = 'particle';
    p.style.cssText = `left:${px}px;top:${py}px;color:${ri===0?'#4a7fa5':ri===1?'#7a5fa8':'#a05070'}`;
    p.textContent = ROWS[ri].names[ci].slice(0,5).toUpperCase();
    document.body.appendChild(p); setTimeout(() => p.remove(), 1100);
  }
  noteDisplay.textContent = `${LETTERS[ci]}  ·  ${ROWS[ri].names[ci].toUpperCase()}`;
  clearTimeout(noteDisplay._t);
  noteDisplay._t = setTimeout(() => { noteDisplay.textContent = '— awaiting input —'; }, 1800);
  if (looping) loopSeq.push({ ri, ci, time: AC.currentTime - loopStart });
}

// ═══════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════
const held = new Set();
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  const k = e.key.toLowerCase();
  const ri = e.shiftKey ? 1 : e.altKey ? 2 : 0;
  const ci = ROWS[0].keys.indexOf(k);
  if (ci === -1) return;
  const mk = `${ri}_${k}_${ci}`;
  if (held.has(mk)) return;
  held.add(mk); resume(); triggerInstr(ri, ci);
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  ROWS[0].keys.forEach((ck, ci) => { if (ck === k) [0,1,2].forEach(ri => held.delete(`${ri}_${ck}_${ci}`)); });
});

// ═══════════════════════════════════════════════════════════
// WAVEFORM
// ═══════════════════════════════════════════════════════════
const cv = document.getElementById('waveform'), cx = cv.getContext('2d');
const wd = new Uint8Array(analyser.frequencyBinCount);
function drawWave() {
  requestAnimationFrame(drawWave);
  cv.width = cv.offsetWidth; cv.height = cv.offsetHeight;
  analyser.getByteTimeDomainData(wd);
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.strokeStyle = '#2a4560'; cx.lineWidth = 1;
  cx.shadowColor = '#4a7fa5'; cx.shadowBlur = 5;
  cx.beginPath();
  const sw = cv.width / wd.length; let x = 0;
  wd.forEach((v, i) => { const y = (v/128)*(cv.height/2); i===0?cx.moveTo(x,y):cx.lineTo(x,y); x+=sw; });
  cx.stroke();
}
drawWave();

// ═══════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════
const bpmEl = document.getElementById('bpm'), bpmV = document.getElementById('bpm-val');
bpmEl.addEventListener('input', () => {
  bpmV.textContent = bpmEl.value;
  const bpm = parseInt(bpmEl.value);
});

const reverbBtn = document.getElementById('reverb-btn');
reverbBtn.addEventListener('click', () => {
  reverbEnabled = !reverbEnabled;
  reverbBtn.classList.toggle('on', reverbEnabled);
  reverbBtn.textContent = reverbEnabled ? 'Reverb ON' : 'Reverb';
});

const loopBtn = document.getElementById('loop-btn');
const llEls = document.querySelectorAll('.loop-light');
let looping = false, loopSeq = [], loopStart = 0, loopInt = null, lightInt = null;
loopBtn.addEventListener('click', () => {
  looping = !looping;
  loopBtn.classList.toggle('on', looping);
  loopBtn.textContent = looping ? 'Loop ON' : 'Loop';
  if (looping) { loopSeq = []; loopStart = AC.currentTime; }
  else if (loopSeq.length > 0) {
    const dur = (60 / parseInt(bpmEl.value)) * 4;
    const play = () => loopSeq.forEach(ev => setTimeout(() => triggerInstr(ev.ri, ev.ci), ev.time*1000));
    play(); loopInt = setInterval(play, dur*1000);
    let ls = 0;
    lightInt = setInterval(() => { llEls.forEach((l,i) => l.classList.toggle('on', i===ls)); ls = (ls+1)%llEls.length; }, (dur*1000)/llEls.length);
  } else { clearInterval(loopInt); clearInterval(lightInt); llEls.forEach(l => l.classList.remove('on')); }
});
document.getElementById('clear-btn').addEventListener('click', () => {
  loopSeq = []; looping = false; clearInterval(loopInt); clearInterval(lightInt);
  llEls.forEach(l => l.classList.remove('on'));
  loopBtn.classList.remove('on'); loopBtn.textContent = 'Loop';
  noteDisplay.textContent = '— cleared —';
  setTimeout(() => { noteDisplay.textContent = '— awaiting input —'; }, 700);
});

// ═══════════════════════════════════════════════════════════
// ULTRA-HD DRUM BUS
// ═══════════════════════════════════════════════════════════
// drumBus → drumComp → analyser
const drumBus  = AC.createGain();     drumBus.gain.value  = 0.9;
const drumComp = AC.createDynamicsCompressor();
drumComp.threshold.value = -20; drumComp.knee.value = 5;
drumComp.ratio.value     = 4.5; drumComp.attack.value = 0.001; drumComp.release.value = 0.06;
drumBus.connect(drumComp); drumComp.connect(analyser);
function routeDrum(node) { node.connect(drumBus); }

function mkKick(f0=155, f1=38, dur=0.44, vol=1.0) {
  const t = AC.currentTime;
  // sub-infra (felt)
  const inf=AC.createOscillator(), infG=AC.createGain();
  inf.type='sine'; inf.frequency.setValueAtTime(f1*0.48,t);
  infG.gain.setValueAtTime(0,t); infG.gain.linearRampToValueAtTime(vol*1.05,t+0.002);
  infG.gain.exponentialRampToValueAtTime(0.001,t+dur+0.2);
  inf.connect(infG); routeDrum(infG); inf.start(t); inf.stop(t+dur+0.22);
  // body sweep
  const body=AC.createOscillator(), bodyG=AC.createGain(), bodyFlt=AC.createBiquadFilter();
  body.type='sine'; body.frequency.setValueAtTime(f0,t); body.frequency.exponentialRampToValueAtTime(f1,t+0.055);
  bodyFlt.type='lowpass'; bodyFlt.frequency.value=220; bodyFlt.Q.value=0.5;
  bodyG.gain.setValueAtTime(0,t); bodyG.gain.linearRampToValueAtTime(vol*0.88,t+0.002);
  bodyG.gain.exponentialRampToValueAtTime(0.001,t+dur);
  body.connect(bodyFlt); bodyFlt.connect(bodyG); routeDrum(bodyG); body.start(t); body.stop(t+dur+0.01);
  // harmonic warmth
  const harm=AC.createOscillator(), harmG=AC.createGain(), harmFlt=AC.createBiquadFilter();
  harm.type='triangle'; harm.frequency.setValueAtTime(f0*2.2,t); harm.frequency.exponentialRampToValueAtTime(f1*1.6,t+0.038);
  harmFlt.type='lowpass'; harmFlt.frequency.value=450;
  harmG.gain.setValueAtTime(vol*0.22,t); harmG.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  harm.connect(harmFlt); harmFlt.connect(harmG); routeDrum(harmG); harm.start(t); harm.stop(t+0.1);
  // transient click
  const cb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.009),AC.sampleRate);
  const cd=cb.getChannelData(0); for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*(1-i/cd.length);
  const csrc=AC.createBufferSource(), cg=AC.createGain(), cf=AC.createBiquadFilter();
  cf.type='bandpass'; cf.frequency.value=4800; cf.Q.value=0.7;
  cg.gain.setValueAtTime(vol*0.55,t); cg.gain.exponentialRampToValueAtTime(0.001,t+0.013);
  csrc.buffer=cb; csrc.connect(cf); cf.connect(cg); routeDrum(cg); csrc.start(t); csrc.stop(t+0.016);
}

function mkSnare(tone=1350, dur=0.21, vol=0.62) {
  const t = AC.currentTime;
  // noise body
  const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate);
  const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const nsrc=AC.createBufferSource(), ng=AC.createGain();
  const nbp=AC.createBiquadFilter(), nhp=AC.createBiquadFilter(), nair=AC.createBiquadFilter();
  nbp.type='bandpass'; nbp.frequency.value=tone; nbp.Q.value=0.8;
  nhp.type='highpass';  nhp.frequency.value=300;
  nair.type='highshelf'; nair.frequency.value=6000; nair.gain.value=5;
  ng.gain.setValueAtTime(vol,t); ng.gain.exponentialRampToValueAtTime(0.001,t+dur);
  nsrc.buffer=nb; nsrc.connect(nbp); nbp.connect(nhp); nhp.connect(nair); nair.connect(ng); routeDrum(ng);
  nsrc.start(t); nsrc.stop(t+dur+0.01);
  // tonal body
  const tO=AC.createOscillator(), tG=AC.createGain();
  tO.type='triangle'; tO.frequency.setValueAtTime(240,t); tO.frequency.exponentialRampToValueAtTime(105,t+0.055);
  tG.gain.setValueAtTime(vol*0.42,t); tG.gain.exponentialRampToValueAtTime(0.001,t+0.075);
  tO.connect(tG); routeDrum(tG); tO.start(t); tO.stop(t+0.08);
  // crack
  const cb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.005),AC.sampleRate);
  const crd=cb.getChannelData(0); for(let i=0;i<crd.length;i++) crd[i]=Math.random()*2-1;
  const csrc=AC.createBufferSource(), cg=AC.createGain(), chp=AC.createBiquadFilter();
  chp.type='highpass'; chp.frequency.value=9000;
  cg.gain.setValueAtTime(vol*0.68,t); cg.gain.exponentialRampToValueAtTime(0.001,t+0.008);
  csrc.buffer=cb; csrc.connect(chp); chp.connect(cg); routeDrum(cg); csrc.start(t); csrc.stop(t+0.009);
}

function mkHat(open=false, vol=0.38) {
  const t = AC.currentTime;
  const dur = open ? 0.36 : 0.038;
  const hb=AC.createBuffer(1,Math.floor(AC.sampleRate*Math.max(dur,0.06)),AC.sampleRate);
  const hd=hb.getChannelData(0);
  for(let i=0;i<hd.length;i++) hd[i]=(Math.random()*2-1)*Math.pow(1-i/hd.length, open?1.8:0.5);
  const hsrc=AC.createBufferSource(), hg=AC.createGain();
  const hp1=AC.createBiquadFilter(), hp2=AC.createBiquadFilter(), pk1=AC.createBiquadFilter(), pk2=AC.createBiquadFilter();
  hp1.type='highpass'; hp1.frequency.value=6200;
  hp2.type='highpass'; hp2.frequency.value=8500;
  pk1.type='peaking'; pk1.frequency.value=9200;  pk1.gain.value=6; pk1.Q.value=1.8;
  pk2.type='peaking'; pk2.frequency.value=12500; pk2.gain.value=4; pk2.Q.value=1.5;
  hg.gain.setValueAtTime(vol,t); hg.gain.exponentialRampToValueAtTime(0.001,t+dur+0.01);
  hsrc.buffer=hb; hsrc.connect(hp1); hp1.connect(hp2); hp2.connect(pk1); pk1.connect(pk2); pk2.connect(hg); routeDrum(hg);
  hsrc.start(t); hsrc.stop(t+dur+0.02);
}

function mkRim() {
  const t = AC.currentTime;
  [[860,0.28],[1650,0.18],[3300,0.09]].forEach(([f,v]) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type='sine'; o.frequency.value=f; flt.type='bandpass'; flt.frequency.value=f; flt.Q.value=9;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.042);
    o.connect(flt); flt.connect(g); routeDrum(g); o.start(t); o.stop(t+0.046);
  });
}

function mkPerc(freq=220, dur=0.085, vol=0.3) {
  const t = AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
  o.type='sine'; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*0.26,t+dur);
  flt.type='lowpass'; flt.frequency.value=freq*3; flt.Q.value=2;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(flt); flt.connect(g); routeDrum(g); o.start(t); o.stop(t+dur+0.01);
}

</script>
<script>

(function(){
'use strict';

const ROW_A=[
  {letter:'Z',key:'a-kick', label:'Kick',   interval:()=>bpmMs(1)   },
  {letter:'U',key:'a-snare',label:'Snare',  interval:()=>bpmMs(2)   },
  {letter:'Z',key:'a-hat',  label:'Hi-hat', interval:()=>bpmMs(0.5) },
  {letter:'A',key:'a-clap', label:'Clap',   interval:()=>bpmMs(2)   },
  {letter:'N',key:'a-tom',  label:'Tom',    interval:()=>bpmMs(1.5) },
  {letter:'K',key:'a-rim',  label:'Rim',    interval:()=>bpmMs(0.75)},
  {letter:'A',key:'a-open', label:'Open HH',interval:()=>bpmMs(4)   },
];
const ROW_B=[
  {letter:'Z',key:'b-sub',  label:'Sub',   interval:null            },
  {letter:'U',key:'b-bass', label:'Bass',  interval:null            },
  {letter:'Z',key:'b-arp',  label:'Arp',   interval:()=>bpmMs(0.5) },
  {letter:'A',key:'b-acid', label:'Acid',  interval:()=>bpmMs(0.75)},
  {letter:'N',key:'b-pad',  label:'Pad',   interval:null            },
  {letter:'K',key:'b-lead', label:'Lead',  interval:()=>bpmMs(1)   },
  {letter:'A',key:'b-chord',label:'Chord', interval:()=>bpmMs(2)   },
];
const ROW_C=[
  {letter:'Z',key:'c-noise', label:'Noise',  interval:()=>bpmMs(0.25) },
  {letter:'U',key:'c-drone', label:'Drone',  interval:null             },
  {letter:'Z',key:'c-perc',  label:'Perc',   interval:()=>bpmMs(0.33) },
  {letter:'A',key:'c-stab',  label:'Stab',   interval:()=>bpmMs(1)    },
  {letter:'N',key:'c-sweep', label:'Sweep',  interval:null             },
  {letter:'K',key:'c-blip',  label:'Blip',   interval:()=>bpmMs(0.5)  },
  {letter:'A',key:'c-glitch',label:'Glitch', interval:()=>bpmMs(0.125)},
];
const ROW_D=[
  {letter:'Z',key:'d-sub2',  label:'Sub 2',  interval:null            },
  {letter:'U',key:'d-808',   label:'808',    interval:()=>bpmMs(1)   },
  {letter:'Z',key:'d-noise2',label:'Rumble', interval:()=>bpmMs(0.375)},
  {letter:'A',key:'d-acid2', label:'Acid 2', interval:()=>bpmMs(0.5) },
  {letter:'N',key:'d-drone2',label:'Drone 2',interval:null            },
  {letter:'K',key:'d-reese', label:'Reese',  interval:null            },
  {letter:'A',key:'d-acid3', label:'Acid 3', interval:()=>bpmMs(1.5) },
];
const ROW_E=[
  {letter:'Z',key:'e-infra', label:'Infra',  interval:null             },
  {letter:'U',key:'e-spray', label:'Spray',  interval:()=>bpmMs(0.125)},
  {letter:'Z',key:'e-drone3',label:'Drone 3',interval:null             },
  {letter:'A',key:'e-acid4', label:'Acid 4', interval:()=>bpmMs(0.25) },
  {letter:'N',key:'e-rubbr', label:'Rubber', interval:null             },
  {letter:'K',key:'e-whoosh',label:'Whoosh', interval:null             },
  {letter:'A',key:'e-acid5', label:'Acid 5', interval:()=>bpmMs(2)    },
];
const ALL=[...ROW_A,...ROW_B,...ROW_C,...ROW_D,...ROW_E];

const ARP  =[440,554,659,880,659,554,440,370];
const ACID =[55,55,73,55,55,73,82,73];
const ACID2=[41,41,55,41,55,62,55,41];
const ACID3=[73,82,110,73,82,73,55,73];
const ACID4=[28,28,37,28,37,44,37,28];
const ACID5=[110,138,165,220,165,138,110,92];
const LEAD =[330,392,440,523,440,392,330,294];
const CHORD=[[261,330,392],[294,370,440],[330,415,494],[261,330,392]];
const STAB =[220,277,330,415];
const BLIP =[880,1108,1318,1760,1318,1108];

let audioCtx=null,playing={},bpm=128,vizTimer=null,beatFlashTimer=null;
let mediaRecorder=null,recChunks=[],recTimer=null,recSeconds=0,recIsRecording=false;
let recDestination=null,recGain=null;

const N_WBARS=40;
const waveformEl=document.getElementById('tz-rec-waveform');
for(let i=0;i<N_WBARS;i++){const b=document.createElement('div');b.className='tz-rec-wbar';waveformEl.appendChild(b);}
const wbars=waveformEl.querySelectorAll('.tz-rec-wbar');
let waveTimer=null;

function bpmMs(b){return(60000/bpm)*b;}
function ac(){
  if(!audioCtx){ audioCtx = AC; }
  return audioCtx;
}

// build rows
function buildRow(defs,id){
  const row=document.getElementById(id);
  defs.forEach(d=>{
    const el=document.createElement('div');el.className='tz-letter';el.id='tzl-'+d.key;
    el.innerHTML=d.letter+'<span class="tz-letter-name">'+d.label+'</span>';
    el.addEventListener('click',ev=>letterClick(d,el,ev));
    row.appendChild(el);
  });
}
buildRow(ROW_A,'tz-row-a');buildRow(ROW_B,'tz-row-b');buildRow(ROW_C,'tz-row-c');
buildRow(ROW_D,'tz-row-d');buildRow(ROW_E,'tz-row-e');

const vizEl=document.getElementById('tz-viz'),N=36;
for(let i=0;i<N;i++){const b=document.createElement('div');b.className='tz-bar';vizEl.appendChild(b);}

// TEMPO
window.tzSetBPM=function(v){
  bpm=Math.max(60,Math.min(220,v));
  document.getElementById('tz-bpm-val').textContent=bpm;
  document.getElementById('tz-bpm-slider').value=bpm;
  Object.keys(playing).forEach(k=>{
    const p=playing[k];
    if(p.intervalId&&p.def?.interval){clearInterval(p.intervalId);p.intervalId=setInterval(p.fn,p.def.interval());}
  });
  if(beatFlashTimer){clearInterval(beatFlashTimer);beatFlashTimer=null;startBeatFlash();}
};
window.tzChangeBPM=function(d){tzSetBPM(bpm+d);};
function startBeatFlash(){if(beatFlashTimer)return;beatFlashTimer=setInterval(()=>{const e=document.getElementById('tz-bpm-val');e.classList.add('beat');setTimeout(()=>e.classList.remove('beat'),60);},bpmMs(1));}
function stopBeatFlash(){clearInterval(beatFlashTimer);beatFlashTimer=null;document.getElementById('tz-bpm-val').classList.remove('beat');}

// RECORDER
window.tzRecToggle=function(){
  if(recIsRecording){tzRecStop();return;}
  const ctx=ac();if(ctx.state==='suspended')ctx.resume();
  recChunks=[];
  const mimes=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg','audio/mp4'];
  const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'';
  try{mediaRecorder=new MediaRecorder(recDestination.stream,mime?{mimeType:mime}:{});}
  catch(e){setRecStatus('not supported in this browser');return;}
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRecorder.onstop=onRecStop;
  mediaRecorder.start(100);
  recIsRecording=true; recSeconds=0;
  document.getElementById('tz-rec-btn').textContent='● Recording…';
  document.getElementById('tz-rec-btn').classList.add('recording');
  document.getElementById('tz-stop-rec-btn').disabled=false;
  document.getElementById('tz-rec-time').classList.add('active');
  setRecStatus('recording live audio…');
  recTimer=setInterval(()=>{recSeconds++;const m=Math.floor(recSeconds/60),s=recSeconds%60;document.getElementById('tz-rec-time').textContent=m+':'+(s<10?'0':'')+s;},1000);
  startWaveAnim();
};
window.tzRecStop=function(){
  if(!recIsRecording||!mediaRecorder)return;
  mediaRecorder.stop(); recIsRecording=false; clearInterval(recTimer);
  document.getElementById('tz-rec-btn').textContent='● Record';
  document.getElementById('tz-rec-btn').classList.remove('recording');
  document.getElementById('tz-stop-rec-btn').disabled=true;
  document.getElementById('tz-rec-time').classList.remove('active');
  stopWaveAnim(); setRecStatus('processing…');
};
function onRecStop(){
  if(recChunks.length===0){setRecStatus('nothing recorded');return;}
  const mime=recChunks[0].type||'audio/webm';
  const blob=new Blob(recChunks,{type:mime});
  const ext=mime.includes('ogg')?'ogg':mime.includes('mp4')?'m4a':'webm';
  const url=URL.createObjectURL(blob);
  const ts=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const fname='zuzanka-'+ts+'.'+ext;
  const dlContainer=document.getElementById('tz-rec-downloads');
  const link=document.createElement('a');
  link.className='tz-rec-link';link.href=url;link.download=fname;
  link.innerHTML=fname+'<span class="tz-rec-link-arrow">↓</span>';
  dlContainer.prepend(link);
  setRecStatus('saved — click to download');
}
function setRecStatus(msg){document.getElementById('tz-rec-status').textContent=msg;}
function startWaveAnim(){
  if(waveTimer)return;
  waveTimer=setInterval(()=>{
    const active=recIsRecording&&Object.keys(playing).length>0;
    wbars.forEach((b,i)=>{
      if(!active){b.style.height='3px';b.style.background='rgba(255,255,255,0.1)';return;}
      const h=Math.round(3+Math.random()*22*(0.4+0.6*Math.sin(i/N_WBARS*Math.PI)));
      b.style.height=h+'px';
      b.style.background=h>10?`rgba(200,${Math.round(20+h)},${Math.round(h*0.4)},0.72)`:'rgba(255,255,255,0.2)';
    });
  },55);
}
function stopWaveAnim(){
  clearInterval(waveTimer);waveTimer=null;
  wbars.forEach(b=>{b.style.height='3px';b.style.background='rgba(255,255,255,0.1)';});
}

// CLICK
function letterClick(d,el,ev){
  const r=document.createElement('div');r.className='tz-ripple';
  r.style.left=ev.clientX+'px';r.style.top=ev.clientY+'px';
  document.body.appendChild(r);setTimeout(()=>r.remove(),950);
  const f=document.getElementById('tz-flash');f.classList.remove('tz-pop');void f.offsetWidth;f.classList.add('tz-pop');
  if(playing[d.key])stopTrack(d.key,el);else startTrack(d,el);
  updateUI();
}

// START TRACK
function startTrack(d,el){
  const ctx=ac();if(ctx.state==='suspended')ctx.resume();
  const mg=ctx.createGain();mg.connect(masterOut);
  mg.gain.value=0.001;
  let node=null,tid=null,fn=null;
  const k=d.key;

  function loop(f,intFn){f();fn=f;tid=setInterval(f,intFn());return tid;}
  function dest(g){g.connect(masterOut);}

  if(k==='a-kick'){
    loop(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(160,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.28);g.gain.setValueAtTime(1.5,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.28);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.3);},d.interval);
  }else if(k==='a-snare'){
    loop(()=>{const len=ctx.sampleRate*0.18,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=1800;filt.Q.value=0.8;const g=ctx.createGain();g.gain.setValueAtTime(0.6,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);src.connect(filt);filt.connect(g);dest(g);src.start();src.stop(ctx.currentTime+0.2);const o=ctx.createOscillator(),g2=ctx.createGain();o.type='triangle';o.frequency.value=200;g2.gain.setValueAtTime(0.35,ctx.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);o.connect(g2);dest(g2);o.start();o.stop(ctx.currentTime+0.1);},d.interval);
  }else if(k==='a-hat'){
    loop(()=>{const len=ctx.sampleRate*0.05,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const filt=ctx.createBiquadFilter();filt.type='highpass';filt.frequency.value=9000;const g=ctx.createGain();g.gain.setValueAtTime(0.35,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.05);src.connect(filt);filt.connect(g);dest(g);src.start();src.stop(ctx.currentTime+0.06);},d.interval);
  }else if(k==='a-clap'){
    loop(()=>{for(let c=0;c<3;c++)setTimeout(()=>{const len=ctx.sampleRate*0.045,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=1200;filt.Q.value=1.2;const g=ctx.createGain();g.gain.setValueAtTime(0.55*(1-c*0.15),ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.05);src.connect(filt);filt.connect(g);dest(g);src.start();},c*14);},d.interval);
  }else if(k==='a-tom'){
    loop(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(120,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+0.22);g.gain.setValueAtTime(0.9,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.28);},d.interval);
  }else if(k==='a-rim'){
    loop(()=>{const len=ctx.sampleRate*0.025,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=4000;filt.Q.value=3;const g=ctx.createGain();g.gain.setValueAtTime(0.7,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.025);src.connect(filt);filt.connect(g);dest(g);src.start();},d.interval);
  }else if(k==='a-open'){
    loop(()=>{const len=ctx.sampleRate*0.35,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const filt=ctx.createBiquadFilter();filt.type='highpass';filt.frequency.value=7000;const g=ctx.createGain();g.gain.setValueAtTime(0.28,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);src.connect(filt);filt.connect(g);dest(g);src.start();src.stop(ctx.currentTime+0.38);},d.interval);
  }else if(k==='b-sub'){
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=40;o.connect(mg);mg.gain.linearRampToValueAtTime(0.5,ctx.currentTime+0.12);o.start();node=o;
  }else if(k==='b-bass'){
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=55;const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=220;o.connect(filt);filt.connect(mg);mg.gain.linearRampToValueAtTime(0.42,ctx.currentTime+0.12);o.start();node=o;
  }else if(k==='b-arp'){
    let ni=0;loop(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=ARP[ni%ARP.length];g.gain.setValueAtTime(0.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.14);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.17);ni++;},d.interval);
  }else if(k==='b-acid'){
    let ni=0;loop(()=>{const o=ctx.createOscillator(),filt=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=ACID[ni%ACID.length];filt.type='lowpass';filt.Q.value=14;filt.frequency.setValueAtTime(180,ctx.currentTime);filt.frequency.exponentialRampToValueAtTime(2200,ctx.currentTime+0.09);filt.frequency.exponentialRampToValueAtTime(350,ctx.currentTime+0.34);g.gain.setValueAtTime(0.42,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.36);o.connect(filt);filt.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.38);ni++;},d.interval);
  }else if(k==='b-pad'){
    const oscs=[110,110.5,220,220.8].map(f=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(mg);o.start();return o;});mg.gain.linearRampToValueAtTime(0.18,ctx.currentTime+0.8);node={stop:()=>oscs.forEach(o=>{try{o.stop();}catch(e){}})};
  }else if(k==='b-lead'){
    let ni=0;loop(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=LEAD[ni%LEAD.length];g.gain.setValueAtTime(0.17,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.21);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.24);ni++;},d.interval);
  }else if(k==='b-chord'){
    let ci=0;loop(()=>{CHORD[ci%CHORD.length].forEach(f=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.55);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.6);});ci++;},d.interval);
  }else if(k==='c-noise'){
    loop(()=>{const len=ctx.sampleRate*0.04,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=3000+Math.random()*3000;filt.Q.value=2;const g=ctx.createGain();g.gain.setValueAtTime(0.28,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.04);src.connect(filt);filt.connect(g);dest(g);src.start();},d.interval);
  }else if(k==='c-drone'){
    const o1=ctx.createOscillator(),o2=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=82.5;o2.type='sawtooth';o2.frequency.value=82.8;o1.connect(mg);o2.connect(mg);mg.gain.linearRampToValueAtTime(0.15,ctx.currentTime+1.2);o1.start();o2.start();node={stop:()=>{try{o1.stop();o2.stop();}catch(e){}}};
  }else if(k==='c-perc'){
    loop(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=1200+Math.random()*800;g.gain.setValueAtTime(0.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.018);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.02);},d.interval);
  }else if(k==='c-stab'){
    let si=0;loop(()=>{const f=STAB[si%STAB.length];[f,f*1.5,f*2].forEach(ff=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=ff;g.gain.setValueAtTime(0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.1);});si++;},d.interval);
  }else if(k==='c-sweep'){
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=165;const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.Q.value=8;filt.frequency.value=800;const lfo=ctx.createOscillator(),lfoG=ctx.createGain();lfo.type='sine';lfo.frequency.value=0.3;lfoG.gain.value=1200;lfo.connect(lfoG);lfoG.connect(filt.frequency);o.connect(filt);filt.connect(mg);mg.gain.linearRampToValueAtTime(0.22,ctx.currentTime+0.5);o.start();lfo.start();node={stop:()=>{try{o.stop();lfo.stop();}catch(e){}}};
  }else if(k==='c-blip'){
    let bi=0;loop(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=BLIP[bi%BLIP.length];g.gain.setValueAtTime(0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.06);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.07);bi++;},d.interval);
  }else if(k==='c-glitch'){
    loop(()=>{if(Math.random()<0.4)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=['square','sawtooth','triangle'][Math.floor(Math.random()*3)];o.frequency.value=200+Math.random()*3000;g.gain.setValueAtTime(0.15*Math.random(),ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.015);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.02);},d.interval);
  }else if(k==='d-sub2'){
    const o=ctx.createOscillator(),lfo=ctx.createOscillator(),lfoG=ctx.createGain();o.type='sine';o.frequency.value=28;lfo.frequency.value=1.8;lfoG.gain.value=3;lfo.connect(lfoG);lfoG.connect(o.frequency);o.connect(mg);mg.gain.linearRampToValueAtTime(0.55,ctx.currentTime+0.2);o.start();lfo.start();node={stop:()=>{try{o.stop();lfo.stop();}catch(e){}}};
  }else if(k==='d-808'){
    loop(()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(220,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+0.15);o.frequency.exponentialRampToValueAtTime(28,ctx.currentTime+0.6);g.gain.setValueAtTime(1.2,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.65);o.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.7);},d.interval);
  }else if(k==='d-noise2'){
    loop(()=>{const len=ctx.sampleRate*0.09,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=600+Math.random()*400;filt.Q.value=4;const g=ctx.createGain();g.gain.setValueAtTime(0.45,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.09);src.connect(filt);filt.connect(g);dest(g);src.start();},d.interval);
  }else if(k==='d-acid2'){
    let ni=0;loop(()=>{const o=ctx.createOscillator(),filt=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=ACID2[ni%ACID2.length];filt.type='lowpass';filt.Q.value=18;filt.frequency.setValueAtTime(80,ctx.currentTime);filt.frequency.exponentialRampToValueAtTime(1400,ctx.currentTime+0.12);filt.frequency.exponentialRampToValueAtTime(120,ctx.currentTime+0.5);g.gain.setValueAtTime(0.5,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.52);o.connect(filt);filt.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.55);ni++;},d.interval);
  }else if(k==='d-drone2'){
    const o1=ctx.createOscillator(),o2=ctx.createOscillator(),o3=ctx.createOscillator();o1.type='square';o1.frequency.value=55;o2.type='square';o2.frequency.value=55.4;o3.type='sine';o3.frequency.value=27.5;o1.connect(mg);o2.connect(mg);o3.connect(mg);mg.gain.linearRampToValueAtTime(0.13,ctx.currentTime+1.5);o1.start();o2.start();o3.start();node={stop:()=>{try{o1.stop();o2.stop();o3.stop();}catch(e){}}};
  }else if(k==='d-reese'){
    const o1=ctx.createOscillator(),o2=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=41;o2.type='sawtooth';o2.frequency.value=41.6;const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=180;filt.Q.value=3;const lfo=ctx.createOscillator(),lfoG=ctx.createGain();lfo.frequency.value=0.8;lfoG.gain.value=80;lfo.connect(lfoG);lfoG.connect(filt.frequency);o1.connect(filt);o2.connect(filt);filt.connect(mg);mg.gain.linearRampToValueAtTime(0.38,ctx.currentTime+0.3);o1.start();o2.start();lfo.start();node={stop:()=>{try{o1.stop();o2.stop();lfo.stop();}catch(e){}}};
  }else if(k==='d-acid3'){
    let ni=0;loop(()=>{const o=ctx.createOscillator(),filt=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=ACID3[ni%ACID3.length];filt.type='lowpass';filt.Q.value=12;filt.frequency.setValueAtTime(300,ctx.currentTime);filt.frequency.exponentialRampToValueAtTime(3500,ctx.currentTime+0.07);filt.frequency.exponentialRampToValueAtTime(500,ctx.currentTime+0.28);g.gain.setValueAtTime(0.38,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);o.connect(filt);filt.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.32);ni++;},d.interval);
  }else if(k==='e-infra'){
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=20;const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=60;o.connect(filt);filt.connect(mg);mg.gain.linearRampToValueAtTime(0.6,ctx.currentTime+0.5);o.start();node=o;
  }else if(k==='e-spray'){
    loop(()=>{const len=ctx.sampleRate*0.02,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;const g=ctx.createGain();g.gain.setValueAtTime(0.22,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.018);src.connect(g);dest(g);src.start();},d.interval);
  }else if(k==='e-drone3'){
    const o=ctx.createOscillator(),lfo=ctx.createOscillator(),lfoG=ctx.createGain();o.type='sawtooth';o.frequency.value=110;lfo.type='sine';lfo.frequency.value=0.08;lfoG.gain.value=40;lfo.connect(lfoG);lfoG.connect(o.frequency);const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.Q.value=5;filt.frequency.value=400;o.connect(filt);filt.connect(mg);mg.gain.linearRampToValueAtTime(0.25,ctx.currentTime+2);o.start();lfo.start();node={stop:()=>{try{o.stop();lfo.stop();}catch(e){}}};
  }else if(k==='e-acid4'){
    let ni=0;loop(()=>{const o=ctx.createOscillator(),filt=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=ACID4[ni%ACID4.length];filt.type='lowpass';filt.Q.value=20;filt.frequency.setValueAtTime(60,ctx.currentTime);filt.frequency.exponentialRampToValueAtTime(900,ctx.currentTime+0.15);filt.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+0.7);g.gain.setValueAtTime(0.55,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.72);o.connect(filt);filt.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.75);ni++;},d.interval);
  }else if(k==='e-rubbr'){
    const o=ctx.createOscillator(),lfo=ctx.createOscillator(),lfoG=ctx.createGain();o.type='sawtooth';o.frequency.value=55;lfo.type='sine';lfo.frequency.value=3;lfoG.gain.value=15;lfo.connect(lfoG);lfoG.connect(o.frequency);const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=300;filt.Q.value=6;o.connect(filt);filt.connect(mg);mg.gain.linearRampToValueAtTime(0.4,ctx.currentTime+0.1);o.start();lfo.start();node={stop:()=>{try{o.stop();lfo.stop();}catch(e){}}};
  }else if(k==='e-whoosh'){
    const len=ctx.sampleRate*4,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.Q.value=6;filt.frequency.value=800;const lfo=ctx.createOscillator(),lfoG=ctx.createGain();lfo.type='sine';lfo.frequency.value=0.4;lfoG.gain.value=700;lfo.connect(lfoG);lfoG.connect(filt.frequency);src.connect(filt);filt.connect(mg);mg.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.5);src.start();lfo.start();node={stop:()=>{try{src.stop();lfo.stop();}catch(e){}}};
  }else if(k==='e-acid5'){
    let ni=0;loop(()=>{const o=ctx.createOscillator(),filt=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=ACID5[ni%ACID5.length];filt.type='lowpass';filt.Q.value=10;filt.frequency.setValueAtTime(500,ctx.currentTime);filt.frequency.exponentialRampToValueAtTime(6000,ctx.currentTime+0.06);filt.frequency.exponentialRampToValueAtTime(800,ctx.currentTime+0.22);g.gain.setValueAtTime(0.28,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.24);o.connect(filt);filt.connect(g);dest(g);o.start();o.stop(ctx.currentTime+0.26);ni++;},d.interval);
  }

  playing[k]={node,intervalId:tid,masterGain:mg,def:d,fn};
  el.classList.remove('tz-fade','tz-burst','tz-on');void el.offsetWidth;el.classList.add('tz-burst');
  setTimeout(()=>{el.classList.remove('tz-burst');el.classList.add('tz-on');},520);
  if(Object.keys(playing).length===1){startViz();startBeatFlash();}
}

function stopTrack(k,el){
  const p=playing[k];if(!p)return;clearInterval(p.intervalId);
  if(p.node){try{if(p.node.stop)p.node.stop();}catch(e){}}
  if(p.masterGain){try{p.masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.06);}catch(e){}}
  delete playing[k];
  el.classList.remove('tz-on','tz-burst');el.classList.add('tz-fade');
  setTimeout(()=>el.classList.remove('tz-fade'),700);
}

function updateUI(){
  const keys=Object.keys(playing);
  const infoEl=document.getElementById('tz-info'),stopEl=document.getElementById('tz-stop');
  if(keys.length===0){
    infoEl.textContent='— —';infoEl.classList.remove('tz-live');
    stopEl.classList.remove('visible');stopViz();stopBeatFlash();
  }else{
    const labels=keys.map(k=>ALL.find(d=>d.key===k)?.label).filter(Boolean);
    infoEl.textContent='▶ '+labels.join('  ·  ');
    infoEl.classList.add('tz-live');stopEl.classList.add('visible');
  }
}

function startViz(){
  if(vizTimer)return;
  const bars=vizEl.querySelectorAll('.tz-bar');
  vizTimer=setInterval(()=>{
    const count=Object.keys(playing).length;
    bars.forEach((b,i)=>{
      if(count===0){b.style.height='3px';b.style.background='rgba(255,255,255,0.1)';b.style.boxShadow='none';return;}
      const base=0.08+0.3*Math.sin(i/N*Math.PI);
      const h=Math.round((base+Math.random()*0.65)*count/ALL.length*32)+3;
      const intensity=h/35,zone=i/N;
      let bg,shadow;
      if(zone<0.28){bg=`rgba(255,255,255,${0.3+intensity*0.6})`;shadow=intensity>0.35?'0 0 4px rgba(255,255,255,0.2)':'none';}
      else if(zone<0.55){bg=`rgba(${Math.round(200+intensity*55)},${Math.round(20+intensity*20)},${Math.round(intensity*14)},${0.45+intensity*0.5})`;shadow=intensity>0.3?'0 0 4px rgba(200,20,20,0.38)':'none';}
      else{bg=`rgba(255,255,255,${0.15+intensity*0.35})`;shadow='none';}
      b.style.height=h+'px';b.style.background=bg;b.style.boxShadow=shadow;
    });
  },65);
}
function stopViz(){
  clearInterval(vizTimer);vizTimer=null;
  vizEl.querySelectorAll('.tz-bar').forEach(b=>{b.style.height='3px';b.style.background='rgba(255,255,255,0.1)';b.style.boxShadow='none';});
}

window.stopTechno=function(){
  ALL.forEach(d=>{const el=document.getElementById('tzl-'+d.key);if(el&&playing[d.key])stopTrack(d.key,el);});
  updateUI();
};

})();

</script>
<script>
(function(){
  var recDest=null,mr=null,chunks=[];
  var t0=null,ti=null,n=0,fmtPref='mp3';
  var btnS=document.getElementById('rec-start'),btnE=document.getElementById('rec-stop');
  var tmEl=document.getElementById('rec-timer'),trEl=document.getElementById('rec-tracks');
  var encEl=document.getElementById('rec-encoding');
  document.querySelectorAll('.rec-fmt').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.rec-fmt').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');fmtPref=b.dataset.fmt;
    });
  });
  function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60);}
  function init(){if(recDest)return;recDest=AC.createMediaStreamDestination();masterOut.connect(recDest);}
  function encodeMP3(L,R,sr){
    var enc=new lamejs.Mp3Encoder(2,sr,320),data=[],bs=1152;
    for(var i=0;i<L.length;i+=bs){
      var ls=L.subarray(i,i+bs),rs=R.subarray(i,i+bs);
      var l16=new Int16Array(ls.length),r16=new Int16Array(rs.length);
      for(var j=0;j<ls.length;j++){l16[j]=Math.max(-32768,Math.min(32767,ls[j]*32767));r16[j]=Math.max(-32768,Math.min(32767,rs[j]*32767));}
      var buf=enc.encodeBuffer(l16,r16);if(buf.length>0)data.push(new Int8Array(buf));
    }
    var end=enc.flush();if(end.length>0)data.push(new Int8Array(end));
    return new Blob(data,{type:'audio/mp3'});
  }
  var sn=null,LB=[],RB=[];
  function startCap(){LB=[];RB=[];sn=AC.createScriptProcessor(4096,2,2);masterOut.connect(sn);sn.connect(AC.destination);sn.onaudioprocess=function(e){if(!mr||mr.state!=='recording')return;LB.push(new Float32Array(e.inputBuffer.getChannelData(0)));RB.push(new Float32Array(e.inputBuffer.getChannelData(1)));}}
  function stopCap(){if(sn){sn.disconnect();try{masterOut.disconnect(sn);}catch(x){}sn=null;}}
  function merge(b){var l=0;b.forEach(function(x){l+=x.length;});var o=new Float32Array(l),f=0;b.forEach(function(x){o.set(x,f);f+=x.length;});return o;}
  function addTrack(nm,url,ext,dur){var d=document.createElement('div');d.className='rec-track';d.innerHTML='<a href="'+url+'" download="'+nm+'.'+ext+'">'+nm+'.'+ext+'</a><span style="opacity:.3">&#183;</span><span>'+dur+'</span>';trEl.appendChild(d);trEl.scrollLeft=trEl.scrollWidth;}
  btnS.addEventListener('click',function(){
    if(AC.state==='suspended')AC.resume();init();chunks=[];
    var mime=['audio/webm;codecs=opus','audio/webm','audio/ogg'].find(function(m){try{return MediaRecorder.isTypeSupported(m);}catch(x){return false;}})||'';
    try{mr=new MediaRecorder(recDest.stream,mime?{mimeType:mime}:{});}catch(x){alert('Recording not supported.');return;}
    if(fmtPref==='mp3')startCap();
    mr.ondataavailable=function(ev){if(ev.data&&ev.data.size>0)chunks.push(ev.data);};
    mr.onstop=function(){
      var dur=fmt(Date.now()-t0);n++;var nm='zuzanka-'+String(n).padStart(2,'0');
      if(fmtPref==='mp3'){stopCap();encEl.classList.add('visible');setTimeout(function(){addTrack(nm,URL.createObjectURL(encodeMP3(merge(LB),merge(RB),AC.sampleRate)),'mp3',dur);encEl.classList.remove('visible');},30);}
      else{var m=mr.mimeType||'audio/webm';addTrack(nm,URL.createObjectURL(new Blob(chunks,{type:m})),m.includes('ogg')?'ogg':'webm',dur);}
    };
    mr.start(200);t0=Date.now();
    btnS.classList.add('armed');btnS.innerHTML='<span class="rec-dot"></span>Recording';
    btnS.disabled=true;btnE.disabled=false;tmEl.classList.add('live');
    ti=setInterval(function(){tmEl.textContent=fmt(Date.now()-t0);},500);
  });
  btnE.addEventListener('click',function(){
    if(mr&&mr.state!=='inactive')mr.stop();
    clearInterval(ti);tmEl.textContent='0:00';tmEl.classList.remove('live');
    btnS.classList.remove('armed');btnS.innerHTML='<span class="rec-dot"></span>Record';
    btnS.disabled=false;btnE.disabled=true;
  });
})();
</script>
