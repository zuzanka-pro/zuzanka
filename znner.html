<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Przegrana — ZUZANKA NON-ESCAPE ROOM</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f4f0;
    --warm-gray: #c8c4bc;
    --mid-gray: #8a8680;
    --light-gray: #e8e5df;
    --accent: #c8102e;
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--warm-gray);
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
    position: relative;
  }

  /* Vignette effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Noise texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 2;
  }

  .loss-container {
    max-width: 900px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 3;
    animation: fadeIn 2s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .loss-cross {
    width: 100px;
    height: 100px;
    position: relative;
    margin: 0 auto 4rem;
    opacity: 0;
    animation: crossReveal 1.5s ease 0.5s forwards;
  }

  @keyframes crossReveal {
    from { opacity: 0; transform: scale(0.8) rotate(-5deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .loss-cross::before,
  .loss-cross::after {
    content: '';
    position: absolute;
    background: var(--accent);
  }

  .loss-cross::before {
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    transform: translateY(-50%);
  }

  .loss-cross::after {
    top: 0;
    left: 50%;
    width: 1px;
    height: 100%;
    transform: translateX(-50%);
  }

  .loss-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--mid-gray);
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeInSlow 1.5s ease 1s forwards;
  }

  @keyframes fadeInSlow {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loss-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.5rem, 8vw, 6rem);
    font-weight: 300;
    font-style: italic;
    line-height: 1.1;
    color: var(--white);
    margin-bottom: 2.5rem;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: fadeInSlow 1.5s ease 1.3s forwards;
  }

  .loss-divider {
    width: 60px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto;
    position: relative;
    opacity: 0;
    animation: dividerExpand 1.2s ease 1.6s forwards;
  }

  @keyframes dividerExpand {
    from { opacity: 0; width: 0; }
    to { opacity: 1; width: 60px; }
  }

  .loss-divider::before,
  .loss-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    transform: translateY(-50%);
  }

  .loss-divider::before { left: -10px; }
  .loss-divider::after { right: -10px; }

  .loss-subtitle {
    font-family: 'EB Garamond', serif;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 400;
    line-height: 1.6;
    color: var(--mid-gray);
    margin-top: 2.5rem;
    margin-bottom: 5rem;
    opacity: 0;
    animation: fadeInSlow 1.5s ease 1.9s forwards;
  }

  .loss-vertical-line {
    width: 1px;
    height: 150px;
    background: linear-gradient(
      to bottom,
      transparent,
      var(--accent) 30%,
      var(--accent) 70%,
      transparent
    );
    margin: 0 auto;
    opacity: 0;
    animation: lineGrow 1.8s ease 2.2s forwards;
  }

  @keyframes lineGrow {
    from { opacity: 0; height: 0; }
    to { opacity: 0.6; height: 150px; }
  }

  .loss-footer {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(200, 196, 188, 0.4);
    opacity: 0;
    animation: fadeIn 1.5s ease 2.5s forwards;
    z-index: 3;
  }

  /* Floating particles */
  .particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }

  .particle-1 {
    top: 20%;
    left: 15%;
    animation: particleFade 8s ease-in-out infinite;
  }

  .particle-2 {
    top: 60%;
    right: 20%;
    animation: particleFade 10s ease-in-out infinite 2s;
  }

  .particle-3 {
    bottom: 30%;
    left: 25%;
    animation: particleFade 12s ease-in-out infinite 4s;
  }

  .particle-4 {
    top: 40%;
    right: 30%;
    animation: particleFade 9s ease-in-out infinite 1s;
  }

  @keyframes particleFade {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: 0.3; transform: translateY(-20px); }
  }

  /* Breathing effect on title */
  .loss-title {
    animation: fadeInSlow 1.5s ease 1.3s forwards, breathe 4s ease-in-out infinite 3s;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  @media (max-width: 768px) {
    .loss-container {
      padding: 1rem;
    }

    .loss-cross {
      width: 60px;
      height: 60px;
    }

    .loss-vertical-line {
      height: 100px;
    }

    .particle {
      display: none;
    }
  }
</style>
</head>
<body>
  <div class="particle particle-1"></div>
  <div class="particle particle-2"></div>
  <div class="particle particle-3"></div>
  <div class="particle particle-4"></div>

  <div class="loss-container">
    <div class="loss-cross"></div>
    
    <div class="loss-number">Koniec — Przegrana</div>
    
    <h1 class="loss-title">
      Udało Ci się uciec<br>z antyucieczkowej gry.
    </h1>
    
    <div class="loss-divider"></div>
    
    <p class="loss-subtitle">
      Powodzenia w innych grach.
    </p>
    
    <div class="loss-vertical-line"></div>
  </div>

  <footer class="loss-footer">
    Koniec
  </footer>
</body>
</html>
