<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WITCH HOUSE ZUZANKA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel+Decorative:wght@400;700;900&display=swap');

:root {
  --bg:        #0a0a0b;
  --surface:   #111114;
  --surface2:  #18181d;
  --border:    #2a2a32;
  --border-hi: #44445a;
  --text:      #dcdce8;
  --text-mid:  #7a7a90;
  --text-dim:  #3a3a4a;
  --c-base:    #4a7fa5;
  --c-shift:   #7a5fa8;
  --c-alt:     #a05070;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 14px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: crosshair;
  display: flex;
  flex-direction: column;
  align-items: center;
}

body::before {
  content:''; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none; z-index:0;
}
body::after {
  content:''; position:fixed; inset:0;
  background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 50%, rgba(0,0,0,0.72) 100%);
  pointer-events:none; z-index:0;
}

.page {
  position:relative; z-index:10;
  width:100%; max-width:900px;
  padding: 2.5rem 1.5rem 10rem;
  display:flex; flex-direction:column; align-items:center;
}

/* HEADER */
header {
  width:100%; display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center; border-bottom:1px solid var(--border);
  padding-bottom:1.4rem; margin-bottom:2rem;
}
.header-meta { font-size:0.65rem; color:var(--text-dim); letter-spacing:0.18em; text-transform:uppercase; }
.header-meta.right { text-align:right; }
.title-block { text-align:center; }
h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.1rem, 3.5vw, 2rem);
  font-weight:700; letter-spacing:0.08em; color:var(--text); line-height:1.15;
}
h1 span.accent { font-weight:400; color:var(--text-mid); }
.tagline { font-size:0.6rem; letter-spacing:0.35em; color:var(--text-dim); text-transform:uppercase; margin-top:0.5rem; }

/* VISUALIZER */
.visualizer-wrap {
  width:100%; height:52px; margin-bottom:2rem;
  position:relative; border:1px solid var(--border); background:var(--surface);
}
canvas#waveform { width:100%; height:100%; display:block; }
.vis-label {
  position:absolute; top:6px; left:10px;
  font-size:0.55rem; letter-spacing:0.2em; color:var(--text-dim); text-transform:uppercase; pointer-events:none;
}

/* ROW GROUPS */
.row-group { width:100%; margin-bottom:1.1rem; }
.row-label {
  font-size:0.58rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--text-dim);
  margin-bottom:0.55rem; display:flex; align-items:center; gap:0.8rem;
}
.row-label::before, .row-label::after { content:''; flex:1; height:1px; background:var(--border); }
.modifier-pill {
  padding:0.1rem 0.55rem; border:1px solid var(--border);
  font-size:0.52rem; letter-spacing:0.2em; color:var(--text-dim); border-radius:2px;
}
.keys-row { display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; }

/* KEY */
.key {
  position:relative; width:85px; height:100px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--border); background:var(--surface); cursor:pointer;
  transition: background 0.08s, border-color 0.08s, transform 0.06s;
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
.key:hover { border-color:var(--border-hi); background:var(--surface2); }
.key::before {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse at 50% 65%, var(--row-color) 0%, transparent 72%);
  opacity:0; transition:opacity 0.1s;
}
.key::after {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--row-color); opacity:0.3; transition:opacity 0.1s;
}
.key.active { transform:scale(0.94); border-color:var(--row-color) !important; background:var(--surface2); }
.key.active::before { opacity:0.2; }
.key.active::after  { opacity:1; }
.key-shortcut { position:absolute; top:5px; right:6px; font-size:0.48rem; color:var(--text-dim); letter-spacing:0.05em; font-weight:500; }
.key-letter { font-family:'Playfair Display', serif; font-size:1.9rem; font-weight:700; color:var(--text-mid); position:relative; z-index:1; transition:color 0.1s; line-height:1; }
.key.active .key-letter, .key:hover .key-letter { color:var(--text); }
.key-name { font-size:0.5rem; letter-spacing:0.14em; color:var(--text-dim); text-transform:uppercase; margin-top:0.4rem; text-align:center; padding:0 3px; position:relative; z-index:1; transition:color 0.1s; line-height:1.3; }
.key.active .key-name { color:var(--text-mid); }
.row-base  { --row-color: var(--c-base);  }
.row-shift { --row-color: var(--c-shift); }
.row-alt   { --row-color: var(--c-alt);   }
@keyframes flash-out { 0%{opacity:0.45;transform:scale(1);} 100%{opacity:0;transform:scale(4);} }
.key-flash { position:absolute; inset:0; border:1px solid var(--row-color); pointer-events:none; animation:flash-out 0.4s ease-out forwards; }

/* STATUS */
.status-bar {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:0.55rem 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  margin:1rem 0; font-size:0.6rem; letter-spacing:0.15em; color:var(--text-dim); text-transform:uppercase;
}
#note-display { font-style:italic; color:var(--text-mid); transition:color 0.3s; letter-spacing:0.1em; font-family:'Playfair Display', serif; font-size:0.75rem; }
.loop-lights { display:flex; gap:3px; align-items:center; }
.loop-light { width:5px; height:5px; border:1px solid var(--border); transition:all 0.08s; }
.loop-light.on { background:var(--c-base); border-color:var(--c-base); box-shadow:0 0 5px var(--c-base); }

/* CONTROLS */
.controls { display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap; justify-content:center; }
.ctrl-group { display:flex; align-items:center; gap:0.6rem; font-size:0.6rem; color:var(--text-dim); letter-spacing:0.2em; text-transform:uppercase; }
input[type=range] { -webkit-appearance:none; width:100px; height:1px; background:var(--border); outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--text-mid); cursor:pointer; transition:background 0.15s; }
input[type=range]:hover::-webkit-slider-thumb { background:var(--text); }
.btn { background:transparent; border:1px solid var(--border); color:var(--text-dim); font-family:'IBM Plex Mono', monospace; font-size:0.58rem; letter-spacing:0.2em; padding:0.42rem 0.9rem; cursor:pointer; transition:all 0.15s; text-transform:uppercase; }
.btn:hover { border-color:var(--border-hi); color:var(--text); }
.btn.on { border-color:var(--c-base); color:var(--c-base); }

/* CORNER PANELS */

/* PARTICLE */
.particle { position:fixed; pointer-events:none; z-index:500; font-size:0.65rem; font-family:'IBM Plex Mono', monospace; letter-spacing:0.08em; animation:pfloat 1.1s ease-out forwards; }
@keyframes pfloat { 0%{opacity:0.85;transform:translateY(0) scale(1);} 100%{opacity:0;transform:translateY(-80px) scale(0.4);} }

footer { margin-top:1.8rem; font-size:0.52rem; letter-spacing:0.35em; color:var(--text-dim); text-transform:uppercase; }

/* ═══════════════════════════════ RECORDING BAR ═══════════════════════════ */
.rec-bar {
  position:fixed; bottom:0; left:0; right:0; height:56px;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; gap:1.4rem;
  z-index:200; font-family:'IBM Plex Mono', monospace;
  font-size:0.56rem; letter-spacing:0.16em; text-transform:uppercase;
  padding:0 1.5rem;
}
.rec-label { color:var(--text-dim); letter-spacing:0.22em; font-size:0.52rem; flex-shrink:0; }
.rec-sep-v { width:1px; height:22px; background:var(--border); flex-shrink:0; }
.rec-btn {
  background:transparent; border:1px solid var(--border); color:var(--text-dim);
  font-family:'IBM Plex Mono', monospace; font-size:0.54rem; letter-spacing:0.2em; text-transform:uppercase;
  padding:0.35rem 0.9rem; cursor:pointer; transition:all 0.15s;
  display:flex; align-items:center; gap:0.45rem; flex-shrink:0;
}
.rec-btn:hover:not(:disabled) { border-color:var(--border-hi); color:var(--text); }
.rec-btn:disabled { opacity:0.28; cursor:not-allowed; }
.rec-btn.armed { border-color:#c84040; color:#c84040; box-shadow:0 0 10px rgba(200,64,64,0.18); }
.rec-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
.rec-btn.armed .rec-dot { animation:blink 0.7s ease-in-out infinite; }
.rec-timer { font-size:0.62rem; color:var(--text-mid); letter-spacing:0.2em; min-width:46px; text-align:center; font-variant-numeric:tabular-nums; flex-shrink:0; }
.rec-timer.live { color:#c84040; }
.rec-tracks { display:flex; align-items:center; gap:0.5rem; overflow-x:auto; max-width:480px; flex-shrink:1; }
.rec-tracks::-webkit-scrollbar { height:2px; }
.rec-tracks::-webkit-scrollbar-thumb { background:var(--border); }
.rec-track { display:flex; align-items:center; gap:0.35rem; border:1px solid var(--border); padding:0.26rem 0.55rem; white-space:nowrap; flex-shrink:0; font-size:0.49rem; color:var(--text-dim); }
.rec-track a { color:var(--c-base); text-decoration:none; }
.rec-track a:hover { color:var(--text); }
.rec-dot-sep { opacity:0.3; }
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="header-meta">v3 · Web Synthesizer</div>
    <div class="title-block">
      <h1>Witch House <span class="accent">Zuzanka</span></h1>
      <p class="tagline">press the letters · cast the spell</p>
    </div>
    <div class="header-meta right">Web Audio API</div>
  </header>

  <div class="visualizer-wrap">
    <canvas id="waveform"></canvas>
    <span class="vis-label">OSC</span>
  </div>

  <div class="row-group">
    <div class="row-label"><span class="modifier-pill">default</span></div>
    <div class="keys-row" id="row-base"></div>
  </div>
  <div class="row-group">
    <div class="row-label"><span class="modifier-pill">shift +</span></div>
    <div class="keys-row" id="row-shift"></div>
  </div>
  <div class="row-group">
    <div class="row-label"><span class="modifier-pill">alt +</span></div>
    <div class="keys-row" id="row-alt"></div>
  </div>

  <div class="status-bar">
    <span id="note-display">— awaiting input —</span>
    <div class="loop-lights" id="loop-lights">
      <div class="loop-light"></div><div class="loop-light"></div>
      <div class="loop-light"></div><div class="loop-light"></div>
      <div class="loop-light"></div><div class="loop-light"></div>
      <div class="loop-light"></div><div class="loop-light"></div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <span>BPM</span>
      <input type="range" id="bpm" min="40" max="160" value="128">
      <span id="bpm-val">128</span>
    </div>
    <button class="btn" id="reverb-btn">Reverb</button>
    <button class="btn" id="loop-btn">Loop</button>
    <button class="btn" id="clear-btn">Clear</button>
  </div>

  <footer>z · u · z · a · n · k · a</footer>
</div>


<!-- RECORDING BAR — lives in DOM before script runs -->
<div class="rec-bar">
  <span class="rec-label">REC</span>
  <div class="rec-sep-v"></div>
  <button class="rec-btn" id="rec-start"><span class="rec-dot"></span>Record</button>
  <button class="rec-btn" id="rec-stop" disabled>&#9632;&nbsp;Stop</button>
  <span class="rec-timer" id="rec-timer">0:00</span>
  <div class="rec-sep-v"></div>
  <div class="rec-tracks" id="rec-tracks"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// AUDIO CONTEXT + MASTER SIGNAL CHAIN
// ═══════════════════════════════════════════════════════════
const AC = new (window.AudioContext || window.webkitAudioContext)();

// ① Analyser — waveform display input, everything routes here
const analyser = AC.createAnalyser();
analyser.fftSize = 2048;

// ② Master EQ — low-shelf warmth + high-shelf air
const eqLo = AC.createBiquadFilter();
eqLo.type = 'lowshelf'; eqLo.frequency.value = 90; eqLo.gain.value = 2.5;
const eqHi = AC.createBiquadFilter();
eqHi.type = 'highshelf'; eqHi.frequency.value = 9000; eqHi.gain.value = 1.5;

// ③ Bus compressor — program glue
const busComp = AC.createDynamicsCompressor();
busComp.threshold.value = -16; busComp.knee.value = 6;
busComp.ratio.value = 3;  busComp.attack.value = 0.003; busComp.release.value = 0.2;

// ④ Limiter — true peak protection
const limiter = AC.createDynamicsCompressor();
limiter.threshold.value = -1; limiter.knee.value = 0;
limiter.ratio.value = 20;    limiter.attack.value = 0.001; limiter.release.value = 0.04;

// ⑤ Master gain
const masterOut = AC.createGain(); masterOut.gain.value = 0.80;

// Wire it: analyser → eqLo → eqHi → busComp → limiter → masterOut → destination
analyser.connect(eqLo);
eqLo.connect(eqHi);
eqHi.connect(busComp);
busComp.connect(limiter);
limiter.connect(masterOut);
masterOut.connect(AC.destination);

// ─── Reverb IR (synthesised convolution) ───────────────────
let reverbEnabled = false, reverbConv = null;
(async () => {
  reverbConv = AC.createConvolver();
  const sr = AC.sampleRate, len = Math.floor(sr * 3.8);
  const buf = AC.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const er = i < sr * 0.02 ? Math.sin(Math.PI * i / (sr * 0.02)) * 0.5 : 0;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t / 3.8, 2.6) + er * (Math.random() * 2 - 1);
    }
  }
  reverbConv.buffer = buf;
})();

// ─── Routing helpers ────────────────────────────────────────
function send(node, wet = 0.35) {
  if (reverbEnabled && reverbConv) {
    const dryG = AC.createGain(), wetG = AC.createGain();
    dryG.gain.value = 1 - wet * 0.5; wetG.gain.value = wet;
    node.connect(dryG); dryG.connect(analyser);
    node.connect(reverbConv); reverbConv.connect(wetG); wetG.connect(analyser);
  } else {
    node.connect(analyser);
  }
}

// Soft-clip waveshaper (warm analogue saturation)
function mkSat(drive = 2.5) {
  const ws = AC.createWaveShaper();
  const n = 512, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2 / n) - 1;
    c[i] = (Math.PI + drive) * x / (Math.PI + drive * Math.abs(x));
  }
  ws.curve = c; ws.oversample = '4x';
  return ws;
}

function resume() { if (AC.state === 'suspended') AC.resume(); }

// ═══════════════════════════════════════════════════════════
// SOUND LIBRARY — 21 instruments
// ═══════════════════════════════════════════════════════════

// ── BASE ROW ────────────────────────────────────────────────
function snd_hexBass() {
  const t = AC.currentTime;
  // triple-layer: sub sine + detuned saw pair
  [[27.5,'sine',0.75,120],[55,'sawtooth',0.26,700],[55.4,'sawtooth',0.24,700]].forEach(([f,type,vol,fco],i) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(i>0) o.frequency.exponentialRampToValueAtTime(f*0.7, t+0.38);
    flt.type='lowpass'; flt.Q.value=i===0?1:5;
    flt.frequency.setValueAtTime(fco,t); flt.frequency.exponentialRampToValueAtTime(fco*0.2,t+0.5);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.9);
    o.connect(flt); flt.connect(g); send(g,0.3); o.start(t); o.stop(t+1.9);
  });
}

function snd_ghostbell() {
  const t = AC.currentTime;
  [[261,0,0.18],[329,0.07,0.15],[392,0.13,0.12],[523,0.19,0.09],[784,0.25,0.06],[1047,0.31,0.04]].forEach(([f,dt,vol]) => {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(vol,t+dt+0.012);
    g.gain.exponentialRampToValueAtTime(0.001,t+dt+3.5);
    o.connect(g); send(g,0.65); o.start(t+dt); o.stop(t+dt+3.5);
  });
}

function snd_covenDrum() {
  const t = AC.currentTime;
  // sub + body + crack
  [[0,'sine',65,25,0,0.6,1.1],[1,'sine',150,50,0,0.5,0.18]].forEach(([,type,f0,f1,dt,vol,dur]) => {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t+dt); o.frequency.exponentialRampToValueAtTime(f1,t+dt+0.2);
    g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(vol,t+dt+0.003);
    g.gain.exponentialRampToValueAtTime(0.001,t+dt+dur);
    o.connect(g); send(g,0.1); o.start(t+dt); o.stop(t+dt+dur+0.01);
  });
  const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.08),AC.sampleRate);
  const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(), ng=AC.createGain(), flt=AC.createBiquadFilter();
  flt.type='bandpass'; flt.frequency.value=3500; flt.Q.value=0.9;
  ng.gain.setValueAtTime(0.28,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  src.buffer=nb; src.connect(flt); flt.connect(ng); send(ng,0.1); src.start(t); src.stop(t+0.08);
}

function snd_witchPad() {
  const t = AC.currentTime;
  [130,130.7,155,155.5,185,220].forEach((f,i) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type=i<4?'sawtooth':'triangle'; o.frequency.value=f+(Math.random()-0.5)*1.2;
    flt.type='lowpass'; flt.frequency.value=1100; flt.Q.value=1.5;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.052,t+0.8);
    g.gain.linearRampToValueAtTime(0.038,t+2.5); g.gain.exponentialRampToValueAtTime(0.001,t+4.5);
    o.connect(flt); flt.connect(g); send(g,0.5); o.start(t); o.stop(t+4.5);
  });
  const sub=AC.createOscillator(), sg=AC.createGain();
  sub.type='sine'; sub.frequency.value=65;
  sg.gain.setValueAtTime(0,t); sg.gain.linearRampToValueAtTime(0.28,t+0.6); sg.gain.exponentialRampToValueAtTime(0.001,t+4.5);
  sub.connect(sg); send(sg,0.2); sub.start(t); sub.stop(t+4.5);
}

function snd_shadowHarp() {
  const t = AC.currentTime;
  [185,247,277,370,415,554].forEach((f,i) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type='triangle'; o.frequency.value=f;
    flt.type='lowpass'; flt.frequency.value=3200-i*350;
    const dt=i*0.082;
    g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(0.22-i*0.022,t+dt+0.009);
    g.gain.exponentialRampToValueAtTime(0.001,t+dt+1.6-i*0.1);
    o.connect(flt); flt.connect(g); send(g,0.45); o.start(t+dt); o.stop(t+dt+1.7);
  });
}

function snd_subDrone() {
  const t = AC.currentTime;
  [[28,'sine',0.45],[28.4,'sine',0.4],[56,'triangle',0.18]].forEach(([f,type,vol]) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type=type; o.frequency.value=f;
    flt.type='lowpass'; flt.frequency.setValueAtTime(160,t); flt.frequency.linearRampToValueAtTime(80,t+5);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.25); g.gain.exponentialRampToValueAtTime(0.001,t+5);
    o.connect(flt); flt.connect(g); send(g,0.2); o.start(t); o.stop(t+5);
  });
}

function snd_sigilFX() {
  const t = AC.currentTime;
  const len=Math.floor(AC.sampleRate*1.1), buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(i/len);}
  const src=AC.createBufferSource(),flt=AC.createBiquadFilter(),flt2=AC.createBiquadFilter(),g=AC.createGain();
  flt.type='bandpass'; flt.Q.value=12;

const noteDisplay = document.getElementById('note-display');
function triggerInstr(ri, ci, px, py) {
  ROWS[ri].sounds[ci]();
  const el = document.getElementById(ROWS[ri].id).children[ci];
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 175);
  const fl = document.createElement('div'); fl.className = 'key-flash'; el.appendChild(fl);
  setTimeout(() => fl.remove(), 420);
  if (px && py) {
    const p = document.createElement('div'); p.className = 'particle';
    p.style.cssText = `left:${px}px;top:${py}px;color:${ri===0?'#4a7fa5':ri===1?'#7a5fa8':'#a05070'}`;
    p.textContent = ROWS[ri].names[ci].slice(0,5).toUpperCase();
    document.body.appendChild(p); setTimeout(() => p.remove(), 1100);
  }
  noteDisplay.textContent = `${LETTERS[ci]}  ·  ${ROWS[ri].names[ci].toUpperCase()}`;
  clearTimeout(noteDisplay._t);
  noteDisplay._t = setTimeout(() => { noteDisplay.textContent = '— awaiting input —'; }, 1800);
  if (looping) loopSeq.push({ ri, ci, time: AC.currentTime - loopStart });
}

// ═══════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════
const held = new Set();
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  const k = e.key.toLowerCase();
  const ri = e.shiftKey ? 1 : e.altKey ? 2 : 0;
  const ci = ROWS[0].keys.indexOf(k);
  if (ci === -1) return;
  const mk = `${ri}_${k}_${ci}`;
  if (held.has(mk)) return;
  held.add(mk); resume(); triggerInstr(ri, ci);
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  ROWS[0].keys.forEach((ck, ci) => { if (ck === k) [0,1,2].forEach(ri => held.delete(`${ri}_${ck}_${ci}`)); });
});

// ═══════════════════════════════════════════════════════════
const cv = document.getElementById('waveform'), cx = cv.getContext('2d');
const wd = new Uint8Array(analyser.frequencyBinCount);
function drawWave() {
  requestAnimationFrame(drawWave);
  cv.width = cv.offsetWidth; cv.height = cv.offsetHeight;
  analyser.getByteTimeDomainData(wd);
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.strokeStyle = '#2a4560'; cx.lineWidth = 1;
  cx.shadowColor = '#4a7fa5'; cx.shadowBlur = 5;
  cx.beginPath();
  const sw = cv.width / wd.length; let x = 0;
  wd.forEach((v, i) => { const y = (v/128)*(cv.height/2); i===0?cx.moveTo(x,y):cx.lineTo(x,y); x+=sw; });
  cx.stroke();
}
drawWave();

const loopBtn = document.getElementById('loop-btn');
const llEls = document.querySelectorAll('.loop-light');
let looping = false, loopSeq = [], loopStart = 0, loopInt = null, lightInt = null;
loopBtn.addEventListener('click', () => {
  looping = !looping;
  loopBtn.classList.toggle('on', looping);
  loopBtn.textContent = looping ? 'Loop ON' : 'Loop';
  if (looping) { loopSeq = []; loopStart = AC.currentTime; }
  else if (loopSeq.length > 0) {
    const dur = (60 / parseInt(bpmEl.value)) * 4;
    const play = () => loopSeq.forEach(ev => setTimeout(() => triggerInstr(ev.ri, ev.ci), ev.time*1000));
    play(); loopInt = setInterval(play, dur*1000);
    let ls = 0;
    lightInt = setInterval(() => { llEls.forEach((l,i) => l.classList.toggle('on', i===ls)); ls = (ls+1)%llEls.length; }, (dur*1000)/llEls.length);
  } else { clearInterval(loopInt); clearInterval(lightInt); llEls.forEach(l => l.classList.remove('on')); }
});
document.getElementById('clear-btn').addEventListener('click', () => {
  loopSeq = []; looping = false; clearInterval(loopInt); clearInterval(lightInt);
  llEls.forEach(l => l.classList.remove('on'));

// drumBus → drumComp → analyser
const drumBus  = AC.createGain();     drumBus.gain.value  = 0.9;
const drumComp = AC.createDynamicsCompressor();
drumComp.threshold.value = -20; drumComp.knee.value = 5;
drumComp.ratio.value     = 4.5; drumComp.attack.value = 0.001; drumComp.release.value = 0.06;
drumBus.connect(drumComp); drumComp.connect(analyser);
function routeDrum(node) { node.connect(drumBus); }

function mkKick(f0=155, f1=38, dur=0.44, vol=1.0) {
  const t = AC.currentTime;
  // sub-infra (felt)
  const inf=AC.createOscillator(), infG=AC.createGain();
  inf.type='sine'; inf.frequency.setValueAtTime(f1*0.48,t);
  infG.gain.setValueAtTime(0,t); infG.gain.linearRampToValueAtTime(vol*1.05,t+0.002);
  infG.gain.exponentialRampToValueAtTime(0.001,t+dur+0.2);
  inf.connect(infG); routeDrum(infG); inf.start(t); inf.stop(t+dur+0.22);
  // body sweep
  const body=AC.createOscillator(), bodyG=AC.createGain(), bodyFlt=AC.createBiquadFilter();
  body.type='sine'; body.frequency.setValueAtTime(f0,t); body.frequency.exponentialRampToValueAtTime(f1,t+0.055);
  bodyFlt.type='lowpass'; bodyFlt.frequency.value=220; bodyFlt.Q.value=0.5;
  bodyG.gain.setValueAtTime(0,t); bodyG.gain.linearRampToValueAtTime(vol*0.88,t+0.002);
  bodyG.gain.exponentialRampToValueAtTime(0.001,t+dur);
  body.connect(bodyFlt); bodyFlt.connect(bodyG); routeDrum(bodyG); body.start(t); body.stop(t+dur+0.01);
  // harmonic warmth
  const harm=AC.createOscillator(), harmG=AC.createGain(), harmFlt=AC.createBiquadFilter();
  harm.type='triangle'; harm.frequency.setValueAtTime(f0*2.2,t); harm.frequency.exponentialRampToValueAtTime(f1*1.6,t+0.038);
  harmFlt.type='lowpass'; harmFlt.frequency.value=450;
  harmG.gain.setValueAtTime(vol*0.22,t); harmG.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  harm.connect(harmFlt); harmFlt.connect(harmG); routeDrum(harmG); harm.start(t); harm.stop(t+0.1);
  // transient click
  const cb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.009),AC.sampleRate);
  const cd=cb.getChannelData(0); for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*(1-i/cd.length);
  const csrc=AC.createBufferSource(), cg=AC.createGain(), cf=AC.createBiquadFilter();
  cf.type='bandpass'; cf.frequency.value=4800; cf.Q.value=0.7;
  cg.gain.setValueAtTime(vol*0.55,t); cg.gain.exponentialRampToValueAtTime(0.001,t+0.013);
  csrc.buffer=cb; csrc.connect(cf); cf.connect(cg); routeDrum(cg); csrc.start(t); csrc.stop(t+0.016);
}

function mkSnare(tone=1350, dur=0.21, vol=0.62) {
  const t = AC.currentTime;
  // noise body
  const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate);
  const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const nsrc=AC.createBufferSource(), ng=AC.createGain();
  const nbp=AC.createBiquadFilter(), nhp=AC.createBiquadFilter(), nair=AC.createBiquadFilter();
  nbp.type='bandpass'; nbp.frequency.value=tone; nbp.Q.value=0.8;
  nhp.type='highpass';  nhp.frequency.value=300;
  nair.type='highshelf'; nair.frequency.value=6000; nair.gain.value=5;
  ng.gain.setValueAtTime(vol,t); ng.gain.exponentialRampToValueAtTime(0.001,t+dur);
  nsrc.buffer=nb; nsrc.connect(nbp); nbp.connect(nhp); nhp.connect(nair); nair.connect(ng); routeDrum(ng);
  nsrc.start(t); nsrc.stop(t+dur+0.01);
  // tonal body
  const tO=AC.createOscillator(), tG=AC.createGain();
  tO.type='triangle'; tO.frequency.setValueAtTime(240,t); tO.frequency.exponentialRampToValueAtTime(105,t+0.055);
  tG.gain.setValueAtTime(vol*0.42,t); tG.gain.exponentialRampToValueAtTime(0.001,t+0.075);
  tO.connect(tG); routeDrum(tG); tO.start(t); tO.stop(t+0.08);
  // crack
  const cb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.005),AC.sampleRate);
  const crd=cb.getChannelData(0); for(let i=0;i<crd.length;i++) crd[i]=Math.random()*2-1;
  const csrc=AC.createBufferSource(), cg=AC.createGain(), chp=AC.createBiquadFilter();
  chp.type='highpass'; chp.frequency.value=9000;
  cg.gain.setValueAtTime(vol*0.68,t); cg.gain.exponentialRampToValueAtTime(0.001,t+0.008);
  csrc.buffer=cb; csrc.connect(chp); chp.connect(cg); routeDrum(cg); csrc.start(t); csrc.stop(t+0.009);
}

function mkHat(open=false, vol=0.38) {
  const t = AC.currentTime;
  const dur = open ? 0.36 : 0.038;
  const hb=AC.createBuffer(1,Math.floor(AC.sampleRate*Math.max(dur,0.06)),AC.sampleRate);
  const hd=hb.getChannelData(0);
  for(let i=0;i<hd.length;i++) hd[i]=(Math.random()*2-1)*Math.pow(1-i/hd.length, open?1.8:0.5);
  const hsrc=AC.createBufferSource(), hg=AC.createGain();
  const hp1=AC.createBiquadFilter(), hp2=AC.createBiquadFilter(), pk1=AC.createBiquadFilter(), pk2=AC.createBiquadFilter();
  hp1.type='highpass'; hp1.frequency.value=6200;
  hp2.type='highpass'; hp2.frequency.value=8500;
  pk1.type='peaking'; pk1.frequency.value=9200;  pk1.gain.value=6; pk1.Q.value=1.8;
  pk2.type='peaking'; pk2.frequency.value=12500; pk2.gain.value=4; pk2.Q.value=1.5;
  hg.gain.setValueAtTime(vol,t); hg.gain.exponentialRampToValueAtTime(0.001,t+dur+0.01);
  hsrc.buffer=hb; hsrc.connect(hp1); hp1.connect(hp2); hp2.connect(pk1); pk1.connect(pk2); pk2.connect(hg); routeDrum(hg);
  hsrc.start(t); hsrc.stop(t+dur+0.02);
}

function mkRim() {
  const t = AC.currentTime;
  [[860,0.28],[1650,0.18],[3300,0.09]].forEach(([f,v]) => {
    const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
    o.type='sine'; o.frequency.value=f; flt.type='bandpass'; flt.frequency.value=f; flt.Q.value=9;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.042);
    o.connect(flt); flt.connect(g); routeDrum(g); o.start(t); o.stop(t+0.046);
  });
}

function mkPerc(freq=220, dur=0.085, vol=0.3) {
  const t = AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain(), flt=AC.createBiquadFilter();
  o.type='sine'; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*0.26,t+dur);
  flt.type='lowpass'; flt.frequency.value=freq*3; flt.Q.value=2;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(flt); flt.connect(g); routeDrum(g); o.start(t); o.stop(t+dur+0.01);
}

// ═══════════════════════════════════════════════════════════
// RECORDING SYSTEM
// ═══════════════════════════════════════════════════════════
// Tap off masterOut so recording captures the full processed signal
let recDest = null;        // MediaStreamDestination — created once, reused
let mediaRecorder = null;
let recChunks     = [];
let recStartTime  = null;
let recTimerInt   = null;
let recCount      = 0;

const recStartBtn = document.getElementById('rec-start');
const recStopBtn  = document.getElementById('rec-stop');
const recTimerEl  = document.getElementById('rec-timer');
const recTracksEl = document.getElementById('rec-tracks');

function fmtTime(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s/60);
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

recStartBtn.addEventListener('click', async () => {
  resume();
  try {
    // Create destination node if not yet created
    if (!recDest) {
      recDest = AC.createMediaStreamDestination();
      masterOut.connect(recDest);          // tap off master output
    }

    const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg'].find(m => {
      try { return MediaRecorder.isTypeSupported(m); } catch(_){ return false; }
    }) || '';

    recChunks = [];
    mediaRecorder = new MediaRecorder(recDest.stream, mimeType ? {mimeType} : {});

    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };

    mediaRecorder.onstop = () => {
      const mime = mediaRecorder.mimeType || 'audio/webm';
      const blob = new Blob(recChunks, {type: mime});
      const url  = URL.createObjectURL(blob);
      const ext  = mime.includes('ogg') ? 'ogg' : 'webm';
      recCount++;
      const elapsed = fmtTime(Date.now() - recStartTime);
      const name = `zuzanka-${String(recCount).padStart(2,'0')}`;

      const track = document.createElement('div');
      track.className = 'rec-track';
      track.innerHTML = `<a href="${url}" download="${name}.${ext}">${name}</a><span class="rec-dot-sep">·</span><span>${elapsed}</span>`;
      recTracksEl.appendChild(track);
      recTracksEl.scrollLeft = recTracksEl.scrollWidth;
    };

    mediaRecorder.start(200);
    recStartTime = Date.now();

    recStartBtn.classList.add('armed');
    recStartBtn.innerHTML = '<span class="rec-dot"></span>Recording';
    recStartBtn.disabled = true;
    recStopBtn.disabled  = false;
    recTimerEl.classList.add('live');

    recTimerInt = setInterval(() => {
      recTimerEl.textContent = fmtTime(Date.now() - recStartTime);
    }, 500);

  } catch(err) {
    console.error('Recording error:', err);
    alert('Recording unavailable in this browser — try Chrome or Firefox.');
  }
});

recStopBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  clearInterval(recTimerInt);
  recTimerEl.textContent = '0:00';
  recTimerEl.classList.remove('live');
  recStartBtn.classList.remove('armed');
  recStartBtn.innerHTML = '<span class="rec-dot"></span>Record';
  recStartBtn.disabled = false;
  recStopBtn.disabled  = true;
});
</script>
